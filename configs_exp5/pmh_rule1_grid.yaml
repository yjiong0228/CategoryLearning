engine_config_path: pmh_rule1_model.yaml

subjects: [501, 503]

dataset:
  processed_dir: ../data_exp5/processed
  learning_data: Rule1_processed.csv

output_dir: ../results/state-based-grid-result-exp5/pmh

n_jobs: 128
n_repeats: 64
refit_repeats: 4096

window_size: 4
stop_at: 1.0
max_trials: null
keep_logs: true

prediction_mode: posterior_t_minus_1
selection_prediction_mode: posterior_t_minus_1
loss_metric: mse

eval:
  target_hypotheses:
    1: 20  # X2*X4 in DiscreteRulePartition(n_dims=5, include_intercept=false)

param_grid:
  gamma: [0.4, 0.7, 0.95]
  w0: [0.05, 0.15, 0.3]
