# Two-layer hyper-optimization (Coordinate Descent) for Exp5 Rule1.
# Outer optimizer: dynamic model settings.
# Inner optimizer: existing grid optimizer over memory params (gamma/w0).
inner_optimizer: grid
inner_base_config_path: ../grid_opt_cfg/pmh_rule1_grid.yaml

subjects: [501, 503]

output_dir: ../../results/state-based-hyper-opt-exp5/pmh/rule1_cd
selection_metric: min_inner_mean_error
save_level: compact
random_seed: 42

cd:
  n_restarts: 3
  max_outer_iters: 5
  init_strategy: random
  coordinate_order: shuffle_each_iter
  patience: 1
  min_delta: 0.0005

hyperparam_space:
  inner.window_size:
    values: [2, 4, 8, 16]

  # Exp5 uses symbolic parity/monomial hypotheses, so avoid ksimilar_centers:
  # these templates tune retention/exploration over the discrete rule set.
  engine.modules.hypo_transitions_mod.kwargs.strategies:
    values:
      - [
          {amount: "fixed", method: "top_posterior", pool: "active", value: 8},
          {amount: "fixed", method: "random", pool: "all_unselected", value: 8}
        ]
      - [
          {amount: "fixed", method: "top_posterior", pool: "active", value: 12},
          {amount: "fixed", method: "random", pool: "all_unselected", value: 4}
        ]
      - [
          {amount: "fixed", method: "top_posterior", pool: "active", value: 4},
          {amount: "fixed", method: "random", pool: "all_unselected", value: 12}
        ]
      - [
          {amount: "entropy_7", method: "random_posterior", pool: "active"},
          {amount: "opp_entropy_7", method: "random", pool: "all_unselected"}
        ]
      - [
          {amount: "confidence_7", method: "random_posterior", pool: "active"},
          {amount: "opp_confidence_7", method: "random", pool: "all_unselected"}
        ]
      - [
          {amount: "fixed", method: "top_posterior", pool: "active", value: 62},
          {amount: "fixed", method: "random", pool: "all_unselected", value: 62}
        ]

  engine.modules.hypo_transitions_mod.kwargs.max_active_hypotheses:
    values: [8, 16, 32, 62]
  engine.modules.hypo_transitions_mod.kwargs.init_num:
    values: [8, 16, 32, 62]

  engine.modules.beta_mod.kwargs.beta_init:
    values: [0.5, 1.0, 2.0, 4.0]
  engine.modules.beta_mod.kwargs.decrease_rate:
    values: [0.05, 0.15, 0.3, 0.5]
  engine.modules.beta_mod.kwargs.correct_additive:
    values: [0.3, 1.0, 2.0]
  engine.modules.beta_mod.kwargs.use_prior_scaling:
    values: [true, false]
  engine.modules.beta_mod.kwargs.prior_beta_scale:
    values: [0.0, 4.0, 8.0, 16.0]

stages:
  coarse:
    inner_overrides:
      n_repeats: 8
      refit_repeats: 16
      keep_logs: false
      n_jobs: 128
      param_grid:
        gamma: [0.2, 0.6, 0.9]
        w0: [0.02, 0.1, 0.3]

  fine:
    inner_overrides:
      n_repeats: 32
      refit_repeats: 128
      keep_logs: false
      n_jobs: 128
      param_grid:
        gamma: [0.1, 0.3, 0.6, 0.8, 0.95]
        w0: [0.01, 0.03, 0.08, 0.15, 0.3]

refine_policy:
  top_k: 6

loss_metric: mse
