data:
  subject_column: iSub
  condition_column: ruleID
  feature_columns: [feature1, feature2, feature3, feature4, feature5]
  category_column: category
  target_type: hard

partition:
  class: src.Bayesian_state.problems.discrete_partitions.DiscreteRulePartition
  kwargs:
    n_dims: 5
    n_cats: 2
    include_intercept: false

modules:
  beta_mod:
    class: src.Bayesian_state.problems.modules.beta.BetaModule
    kwargs:
      beta_init: 2.0
      beta_min: 0.1
      beta_max: 50.0
      decrease_rate: 0.2
      correct_additive: 1.0
      use_prior_scaling: true
      prior_beta_scale: 8.0

  hypo_transitions_mod:
    class: src.Bayesian_state.problems.modules.hypo_transitions.DynamicHypothesisModule
    kwargs:
      strategies:
        - {label: retain_top, amount: fixed, method: top_posterior, pool: active, value: 8}
        - {label: explore_random, amount: fixed, method: random, pool: inactive, value: 8}
      init_num: 12
      max_active_hypotheses: 16

  likelihood_mod:
    class: src.Bayesian_state.problems.modules.likelihood.LikelihoodModule
    kwargs:
      distance_mode: rule

  memory_mod:
    class: src.Bayesian_state.problems.modules.memory.DualMemoryModule
    kwargs:
      gamma: 0.7
      w0: 0.05

agenda:
  - hypo_transitions_mod
  - likelihood_mod
  - memory_mod
  - beta_mod
