<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Task1a</title>

    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
        }

        h2 {
            position: absolute;
            top: 18%;
            left: 50%;
            transform: translateX(-50%);
        }        

        #text {
            position: absolute;
            top: 18%;
            left: 50%;
            transform: translateX(-50%);
        }

        button {
            position: absolute;
            bottom: 15%;
            right: 30%;
            width: 60px;
            height: 40px;
            font-size: 18px;
            transform: translateX(-50%);
        }

        #timer {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
            font-weight: bold;
        }

    </style>

    <script src="jquery-3.7.1.min.js"></script>
</head>

<body style="background-color: gray">
    <form id="info" style="text-align: center">
        <label for="subID">subID: </label>
        <input type="number" id="subID" name="subID" required><br><br>
        <input type="submit" value="继续">
    </form>

    <div id="show_1" style="display: none">
        <canvas id="canvas_1" height="600" width="1200"></canvas>
    </div>

    <div id="instruction" style="display: none; text-align: center">
        <h1>任务1a</h1>
        <div id="text" style="font-size: 18px; line-height: 1.5">Loading...</div>
        <button onclick="timer(5,0); exploration()">开始</button>
    </div>

    <div id="show_2" style="display: none">
        <canvas id="canvas_2" height="600" width="1200"></canvas>
    </div> 

    <div id="exploration" style="display: none">
        <div id="timer" style="display: none"><b>剩余时间 5:00</b></div>
    </div>

    <div id="ending" style="display: none; text-align: center">
        <h1>任务1a</h1>
        <h2>时间到！请向主试示意。</h2>        
    </div>


    <script src="animal.js"></script>

    <script>
        var subID;
        var animal_1;
        var animal_2;

        document.getElementById('info').addEventListener('submit', function(event) {
            event.preventDefault();

            subID = document.getElementById('subID').value;

            if (!isNaN(subID)) {
                document.getElementById('info').style.display = 'none';
                document.getElementById('instruction').style.display = 'block';
                document.getElementById('show_1').style.display = 'block';
            } else {
                alert('请输入数字');
            }
            
            text.innerHTML = `用鼠标点击并拖动端点，探索绿、黄、粉、蓝这4个器官的长度变化范围，构造出不同形态的生物。<br />
            准备好后请点击“开始”按钮。`;

            animal_1 = new Animal("canvas_1", 1);
            animal_2 = new Animal("canvas_2", 2);
            animal_1.draw();
        });

        function timer(minutes, seconds) {
            const timer = document.getElementById('timer');
            setTimeout(() => {
                timer.style.display = 'block';

                const interval = setInterval(() => {
                    if (seconds === 0) {
                        minutes--;
                        seconds = 59;
                    } else {
                        seconds--;
                    }

                    timer.textContent = `剩余时间 ${minutes}:${seconds < 10 ? '0' + seconds : seconds}`;

                    if (minutes === 0 && seconds === 0) {
                        clearInterval(interval);
                        downloadcsv(mouseTrajectory, ['x', 'y', 'node', 'timestamp'], "Task1a_"+subID+"_mouse.csv");
                        downloadcsv(featureTrajectory, ['f1_length', 'f2_length', 'f3_length', 'f4_length', 'timestamp'], 
                        "Task1a_"+subID+"_feature.csv");

                        document.getElementById("timer").style.display = "none";
                        document.getElementById("exploration").style.display = "none";
                        document.getElementById("show_2").style.display = "none";
                        document.getElementById("ending").style.display = "block";
                    }
                }, 1000);
            });
        }

        function exploration() {
            document.getElementById("instruction").style.display = "none";
            document.getElementById("show_1").style.display = "none";
            document.getElementById("exploration").style.display = "block";
            document.getElementById("show_2").style.display = "block";
            animal_2.draw();
        }

        function downloadcsv(data, headers, filename) {
            const csvContent = "data:text/csv;charset=utf-8," +
                headers.join(',') + '\n' +  // Add headers as first row
                data.map((point) => Object.values(point).join(',')).join('\n');

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

    </script>

</body>

</html>
