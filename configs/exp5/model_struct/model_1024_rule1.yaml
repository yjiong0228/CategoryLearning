# Fixed example parameters for interface validation; not individual estimates.
provenance:
  model_id: model_1024
  task: exp5_rule1
  specification_version: model1024_exp5_parity_v1
  scientific_status: fixed_example_interface_validation
  catalogue: discrete_parity_fixed_labels_v1
  grammar: exp5_parity_position_polarity_edits_v1
  relation_measure: exact_uniform_32_patterns
  perception: exact_black_white
partition:
  class: src.Bayesian_state.hypothesis_space.observation_model.exp5_partition.Exp5ParityPartition
  kwargs: {n_dims: 5, n_cats: 2, include_intercept: false}
inference:
  backend: particle_filter
  particle_count: 8
  resample_threshold_fraction: 0.5
likelihood:
  distance_mode: rule
  beta_source: action
  feedback_likelihood_mode: category_feedback
  feedback_lapse: 0.0
modules:
  perception_mod:
    class: src.Bayesian_state.model.modules.discrete_perception.ExactBinaryPerceptionModule
    kwargs: {features: 5}
  beta_mod:
    class: src.Bayesian_state.model.modules.beta.BetaModule
    kwargs:
      beta_init: 2.0
      beta_min: 0.1
      beta_max: 25.0
      learning_rate: 0.1
      beta_update_mode: feedback_gradient
      update_scope: active_hypotheses
      probabilistic_feedback_lapse: 0.0
      use_prior_scaling: false
      prior_beta_scale: 0.0
  hypo_transitions_mod:
    class: src.Bayesian_state.model.modules.hypothesis_transition.mechanistic_rule_search.MechanisticRuleSearchHypothesisTransitionModule
    kwargs:
      mechanism_version: 0923-full-v3
      max_capacity: 3
      exit_rate: 0.0
      local_structure_weight: 1.0
      transfer_scale: 0.01
      execution_inertia: 2.0  # Set to 0 for the zero-persistence boundary.
      tau_proposal: 0.1
      relation_samples: 32  # Exact enumeration, no Monte Carlo sampling.
      relation_seed: 0
      edit_costs: {position: 1.0, polarity: 1.0}
      intervention: {kind: E, decay: 0.8, capacity: evidence, search: accumulate}
      search_controller:
        baseline_probability: 0.05
        error_gain: 1.0
        failure_decay: 0.6
        global_search: 0.2
        global_search_failure_gain: 0.0
  memory_mod:
    class: src.Bayesian_state.model.modules.memory.DualMemoryModule
    kwargs: {forgetting_mode: exact_power, gamma: 1.0, w0: 0.0, feedback_gain: 1.0}
choice_readout:
  kwargs: {method: expectation, power: 1.0, strategy_confidence_gain: 0.0}
output_noise:
  kwargs: {enabled: false}
agenda: [perception_mod, hypo_transitions_mod, memory_mod, beta_mod]
oral_readout: null
