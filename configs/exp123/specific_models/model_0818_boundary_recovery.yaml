analysis_id: model_0818_cond1_zero_positive_boundary_recovery_v1
scope: synthetic_one_at_a_time_boundary_recovery_before_observed_fit

parameter_space: configs/exp123/specific_models/model_0818_cond1_parameter_space.yaml
base_simulation_config: configs/exp123/simulation_cfg/model0818_cond1_boundary_recovery.yaml
output_dir: results/model_0818/cond1/boundary_recovery

design:
  template_subjects: [103]
  trials_per_dataset: 64
  datasets_per_profile_per_subject: 1
  particle_count: 32
  filter_seed_count: 2
  resample_threshold_fraction: 0.5
  n_jobs: 2
  base_seed: 20260818
  near_best_delta_nll: 2.0
  profile_design: all_zero_plus_one_positive_mechanism_at_a_time

# Every probe must be a member of the corresponding positive_values list in
# model_0818_cond1_parameter_space.yaml.  These are recovery probes, not new
# fitted ranges.
positive_probes:
  delta_E: 0.4795730802618863
  c_A: 2.00
  c_G: 0.50

smoke:
  trials_per_dataset: 32
  particle_count: 4
  filter_seed_count: 2
  n_jobs: 2

# Targeted next-stage recovery pilot.  This increases independent trajectories,
# schedule diversity, sequence length, and PF budget while remaining far below
# the eventual formal recovery design.
pilot:
  template_subjects: [103, 111]
  trials_per_dataset: 64
  datasets_per_profile_per_subject: 2
  particle_count: 16
  filter_seed_count: 2
  n_jobs: 4

numerical_stability:
  enabled: true
  # One zero-boundary and one strong positive-boundary trajectory are rescored;
  # these settings diagnose R/B sensitivity and do not increase recovery n.
  profile_ids: [B000_all_zero, B010_c_A]
  subject_id: 103
  replicate: 0
  settings:
    - particle_count: 8
      filter_seed_count: 2
      seed_ensemble: A
      seed_family: stability_paired_across_particle_counts_v2
      cache_namespace: stability_paired_R_v2_R8_B2
    - particle_count: 16
      filter_seed_count: 2
      seed_ensemble: A
      seed_family: stability_paired_across_particle_counts_v2
      cache_namespace: stability_paired_R_v2_R16_B2
    - particle_count: 32
      filter_seed_count: 2
      seed_ensemble: A
      seed_family: stability_paired_across_particle_counts_v2
      cache_namespace: stability_paired_R_v2_R32_B2
    - particle_count: 16
      filter_seed_count: 4
      seed_ensemble: A
      seed_family: stability_paired_across_particle_counts_v2
      cache_namespace: stability_paired_R_v2_R16_B4
    # The four settings below form the predeclared high-budget calibration.
    # Within A or B, R32 and R64 use the same four logical filter seeds.
    - particle_count: 32
      filter_seed_count: 4
      seed_ensemble: A
      seed_family: stability_paired_across_particle_counts_v2
      cache_namespace: stability_paired_R_v2_R32_B4
      high_budget_calibration: true
    - particle_count: 64
      filter_seed_count: 4
      seed_ensemble: A
      seed_family: stability_paired_across_particle_counts_v2
      cache_namespace: stability_paired_R_v2_R64_B4
      high_budget_calibration: true
    - particle_count: 32
      filter_seed_count: 4
      seed_ensemble: B
      seed_family: stability_independent_seed_ensemble_b_v1
      cache_namespace: stability_independent_B_v1_R32_B4
      high_budget_calibration: true
    - particle_count: 64
      filter_seed_count: 4
      seed_ensemble: B
      seed_family: stability_independent_seed_ensemble_b_v1
      cache_namespace: stability_independent_B_v1_R64_B4
      high_budget_calibration: true
  calibration_gates:
    # All thresholds are declared before the high-budget scores are computed.
    minimum_median_candidate_rank_spearman: 0.80
    minimum_worst_candidate_rank_spearman: 0.40
    minimum_winner_agreement: 0.75
    required_particle_counts: [32, 64]
    required_filter_seed_count: 4
    required_seed_ensembles: [A, B]

report:
  interpretation: pipeline_smoke_not_recovery_evidence
  expected_profile_count: 4
