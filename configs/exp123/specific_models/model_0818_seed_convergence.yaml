analysis_id: model_0818_cond1_r32_nested_seed_convergence_v1
scope: synthetic_pf_seed_convergence_before_formal_recovery

parameter_space: configs/exp123/specific_models/model_0818_cond1_parameter_space.yaml
boundary_recovery_config: configs/exp123/specific_models/model_0818_boundary_recovery.yaml
base_simulation_config: configs/exp123/simulation_cfg/model0818_cond1_boundary_recovery.yaml
source_pilot_dir: results/model_0818/cond1/boundary_recovery/pf_budget_calibration_v1/pilot
output_dir: results/model_0818/cond1/boundary_recovery/seed_convergence_r32_b16_v1

# These two autonomous trajectories were fixed before this run. Observed human
# choices are forbidden; the source NPZ files contain model-generated choices.
dataset_ids:
  - B000_all_zero_subject_103_replicate_00
  - B010_c_A_subject_103_replicate_00

design:
  particle_count: 32
  filter_seed_count: 16
  nested_checkpoints: [2, 4, 8, 16]
  seed_family: model0818_r32_nested_b16_v1
  cache_namespace: R32_nested_B16_v1
  resample_threshold_fraction: 0.5
  n_jobs: 128
  probability_aggregation: mean_probability_then_nll
  independent_halves: [8, 8]

bootstrap:
  replicates: 4000
  confidence_level: 0.95
  base_seed: 20260819
  paired_seed_resampling_across_candidates: true

# Declared before running the 128 PF tasks.  The first gate limits the change
# when extending the same nested seed bank from B8 to B16.  The second limits
# Monte Carlo uncertainty in every pairwise candidate delta-NLL at B16.
convergence_gates:
  comparison_from_seed_count: 8
  comparison_to_seed_count: 16
  maximum_absolute_candidate_nll_change: 0.10
  maximum_pairwise_delta_nll_ci_half_width: 0.20

execution:
  parallel_unit: one_dataset_by_candidate_by_filter_seed
  expected_task_count: 128
  numerical_library_threads_per_process: 1
