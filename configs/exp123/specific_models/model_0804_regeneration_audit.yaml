analysis_id: model_0804_cond1_fa2r_regeneration_audit_20260804_v1
base_config: configs/model_0804_cond1_preflight.yaml
scope: fa2r_fixed_rho_structural_audit_not_parameter_optimization

data_scope:
  subject_id: 101
  model_id: FA2R
  anchors_zero_based: [15, 47, 95, 159]
  horizon: 128
  reason: exact_reuse_of_frozen_forgetting_audit_design

filter_anchor_sampling:
  particle_count: 512
  posterior_state_pairs_per_anchor: 64
  independent_filter_seeds: [20260804, 20260805]
  resample_threshold_fraction: 0.5

common_future:
  coupling_seed: 20260804
  same_transition_innovations_within_pair: true
  same_observed_choices_within_pair: true
  same_feedback_within_pair: true

fixed_parameters:
  source: base_config_preflight_fixed_parameter_probe
  lapse: 0.02
  probes:
    - {id: fa2r_rho0p00, w0: 0.40, gamma: 0.70, m: 0.15, g: 0.35, rho: 0.00}
    - {id: fa2r_rho0p01, w0: 0.40, gamma: 0.70, m: 0.15, g: 0.35, rho: 0.01}
    - {id: fa2r_rho0p02, w0: 0.40, gamma: 0.70, m: 0.15, g: 0.35, rho: 0.02}
    - {id: fa2r_rho0p05, w0: 0.40, gamma: 0.70, m: 0.15, g: 0.35, rho: 0.05}

metrics:
  - active_overlap_distance
  - exact_state_coupling
  - empirical_and_theoretical_no_reset_survival
  - omega_total_variation
  - absolute_and_marginal_choice_probability_difference
  - post_reset_coupling_violations

forgetting_gate:
  terminal_window: 16
  predictive:
    maximum_mean_choice_probability_difference: 0.005
    maximum_p95_choice_probability_difference: 0.02
  state:
    maximum_median_omega_total_variation: 0.05
    maximum_median_active_distance: 0.20
  route_rules:
    purpose: select_structurally_viable_fixed_rho_for_recovery_not_for_real_fit

guardrails:
  - fixed_rho_values_not_optimized
  - rho_zero_must_recover_fa2_exactly
  - every_common_reset_must_produce_exact_state_coupling
  - no_nll_or_model_comparison_claim
  - formal_32_subject_fit_remains_closed
