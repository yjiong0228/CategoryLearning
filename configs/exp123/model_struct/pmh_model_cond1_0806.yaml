# Model 0806 inside the standard StateModel framework.
#
# The only model-specific mechanism is the within-subject fixed-capacity,
# trial-varying hypothesis transition. Hyperparameter workflows may override
# capacity separately for each subject. Perception, likelihood, dual memory,
# beta, choice readout, output noise, and execution order remain standard.

partition:
  class: src.Bayesian_state.hypothesis_space.observation_model.continuous_partition.ContinuousPartition
  kwargs:
    n_dims: 4
    n_cats: 2

inference:
  backend: particle_filter
  particle_count: 512
  resample_threshold_fraction: 0.5

likelihood:
  distance_mode: prototype

modules:
  perception_mod:
    class: src.Bayesian_state.model.modules.perception.PerceptionModule

  # Fixed hypothesis-level category sensitivity.  The 0806 transition is the
  # source of trial-varying structural dynamics; beta evolution is not added as
  # a second adaptation mechanism in this baseline configuration.
  beta_mod:
    class: src.Bayesian_state.model.modules.beta.BetaModule
    kwargs:
      beta_init: 5.0
      beta_min: 0.1
      beta_max: 25.0
      decrease_rate: 0.0
      correct_additive: 0.0
      beta_update_mode: probabilistic_feedback
      probabilistic_feedback_lapse: 0.0
      use_prior_scaling: false
      prior_beta_scale: 0.0

  hypo_transitions_mod:
    class: src.Bayesian_state.model.modules.hypothesis_transition.dynamic_adaptive_control.DynamicAdaptiveControlHypothesisTransitionModule
    kwargs:
      # Fallback capacity. Model 0809 Hyper-CD selects a subject-specific M_s
      # and writes it into the generated simulation config's subject_overrides.
      capacity: 3
      m: 0.15
      m_phi: 0.50
      m_beta_surprise: 0.80
      surprise_center: 2.56
      surprise_scale: 4.58
      # The module supports uncertainty-only and joint controllers.  The
      # default remains the prespecified surprise-driven 0806 candidate.
      m_beta_uncertainty: 0.0
      uncertainty_center: 0.1332542767
      uncertainty_scale: 0.0643078377
      g: 0.35
      # Optional FA3-MG range controller.  All coefficients are zero here, so
      # the baseline model retains static g=0.35 unless a hyper config selects
      # an explicitly dynamic range-controller candidate.
      range_controller:
        g_phi: 0.0
        g_beta_surprise: 0.0
        g_beta_uncertainty: 0.0
      epsilon: 1.0e-12

  memory_mod:
    class: src.Bayesian_state.model.modules.memory.DualMemoryModule
    kwargs:
      gamma: 0.70
      w0: 0.40
      feedback_gain: 1.0

choice_readout:
  kwargs:
    method: sharpened_expectation
    power: 2.0

output_noise:
  kwargs:
    enabled: true
    base_lapse: 0.05
    post_error_lapse: 0.0
    low_accuracy_lapse: 0.0
    low_accuracy_threshold: 0.70
    recent_accuracy_window: 8
    lapse_decay: 0.0
    max_lapse: 1.0
    lapse_target: uniform
    latent_volatility_lapse: 0.0
    latent_volatility_power: 1.0

agenda:
  - perception_mod
  - hypo_transitions_mod
  - memory_mod
  - beta_mod
