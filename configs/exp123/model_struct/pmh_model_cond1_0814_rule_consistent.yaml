# Rule-consistent candidate revision of the retained 0813 model.
#
# This file defines a model structure for numerical/mechanism validation.  It
# does not inherit the 0813 fit claims: boundary geometry, fixed-scale rule
# evidence, removal of strategy-confidence sharpening, and a common capacity
# all change the model and therefore require new fitting and PPCs.

partition:
  class: src.Bayesian_state.hypothesis_space.observation_model.continuous_partition.ContinuousPartition
  kwargs:
    n_dims: 4
    n_cats: 2

inference:
  backend: particle_filter
  # A formal particle count has not yet passed the frozen convergence gate.
  # 512 is the next calibration point, not an assertion of convergence.
  particle_count: 512
  resample_threshold_fraction: 0.5

likelihood:
  # Distances are measured to the semantic category regions, so the soft
  # emission cannot move a band's stated boundary from 0.40/0.60 to 0.35/0.65.
  distance_mode: boundary
  # Rule evidence has a fixed scale; action confidence remains in beta_mod.
  beta_source: fixed
  default_beta: 5.0

modules:
  perception_mod:
    class: src.Bayesian_state.model.modules.perception.PerceptionModule

  beta_mod:
    class: src.Bayesian_state.model.modules.beta.BetaModule
    kwargs:
      beta_init: 5.0
      beta_min: 0.1
      beta_max: 25.0
      decrease_rate: 0.15
      correct_additive: 1.0
      beta_update_mode: probabilistic_feedback
      update_scope: executed_hypothesis
      probabilistic_feedback_lapse: 0.0
      use_prior_scaling: false
      prior_beta_scale: 0.0

  hypo_transitions_mod:
    class: src.Bayesian_state.model.modules.hypothesis_transition.dynamic_adaptive_control.DynamicAdaptiveControlHypothesisTransitionModule
    kwargs:
      # One common structural candidate. Subject-specific capacity must be
      # selected and recovered in a nested comparison before being restored.
      capacity: 3
      surprise_center: 2.56
      surprise_scale: 4.58
      uncertainty_center: 0.1332542767
      uncertainty_scale: 0.0643078377
      continuous_controller:
        mode: failure_accumulator_v2
        state:
          failure_decay: 0.60
          mastery_decay: 0.90
          initial_failure: 0.0
          initial_mastery: 0.50
        exploration:
          event_min: 0.05
          event_max: 0.65
          failure_threshold: 0.55
          failure_gain: 10.0
          uncertainty_weight: 0.0
          mastery_weight: 1.0
          surprise_weight: 0.0
          rise_rate: 0.80
          recovery_rate: 0.20
        range:
          global_min: 0.05
          global_max: 0.80
          failure_threshold: 0.75
          failure_gain: 12.0
          uncertainty_weight: 0.0
          mastery_weight: 0.0
          surprise_weight: 0.0
          rise_rate: 0.80
          recovery_rate: 0.20
        execution:
          enabled: true
          switch_scale: 0.20
      epsilon: 1.0e-12

  memory_mod:
    class: src.Bayesian_state.model.modules.memory.DualMemoryModule
    kwargs:
      gamma: 0.80
      w0: 0.15
      feedback_gain: 1.0

choice_readout:
  kwargs:
    # Persistent execution leaves one rule at readout, so power sharpening is
    # an exact no-op. Strategy-confidence sharpening is removed because it is
    # algebraically another multiplier on the same action beta.
    method: expectation
    power: 1.0
    strategy_confidence_gain: 0.0

output_noise:
  kwargs:
    enabled: true
    base_lapse: 0.02
    post_error_lapse: 0.0
    low_accuracy_lapse: 0.0
    low_accuracy_threshold: 0.7
    recent_accuracy_window: 8
    lapse_decay: 0.0
    max_lapse: 1.0
    lapse_target: uniform
    latent_volatility_lapse: 0.0
    latent_volatility_power: 1.0

agenda:
  - perception_mod
  - hypo_transitions_mod
  - memory_mod
  - beta_mod
