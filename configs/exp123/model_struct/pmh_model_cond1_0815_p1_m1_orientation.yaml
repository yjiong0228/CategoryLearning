# P1 sensitivity model: P0 plus a parameter-free binary orientation belief.
# All geometry, controller, memory, beta, lapse, and PF settings match M0.

provenance:
  model_id: model0815_p1_m1_orientation
  parent_model_id: model0815_p0
  scientific_status: unfitted_mapping_sensitivity_candidate
  label_mapping:
    mode: minimal_binary_orientation
    representation: rao_blackwellized_per_active_geometry
    free_parameters_added: 0
    newcomer_prior: 0.5
  workspace_capacity:
    value: 3
    scope: cohort_common
    source: prespecified_simple_baseline_not_subject_level_estimate
  initialization:
    mode: prior_weighted_without_replacement
    pool: full_fixed_label_geometry_space
    interpretation: latent_initialization_integrated_by_pf_particles

partition:
  class: src.Bayesian_state.hypothesis_space.observation_model.continuous_partition.ContinuousPartition
  kwargs:
    n_dims: 4
    n_cats: 2

inference:
  backend: particle_filter
  particle_count: 128
  resample_threshold_fraction: 0.5

likelihood:
  distance_mode: boundary
  beta_source: fixed
  default_beta: 5.0

modules:
  perception_mod:
    class: src.Bayesian_state.model.modules.perception.PerceptionModule

  beta_mod:
    class: src.Bayesian_state.model.modules.beta.BetaModule
    kwargs:
      beta_init: 5.0
      beta_min: 0.1
      beta_max: 25.0
      decrease_rate: 0.15
      correct_additive: 1.0
      beta_update_mode: probabilistic_feedback
      update_scope: executed_hypothesis
      probabilistic_feedback_lapse: 0.0
      use_prior_scaling: false
      prior_beta_scale: 0.0

  hypo_transitions_mod:
    class: src.Bayesian_state.model.modules.hypothesis_transition.dynamic_adaptive_control.DynamicAdaptiveControlHypothesisTransitionModule
    kwargs:
      capacity: 3
      surprise_center: 2.56
      surprise_scale: 4.58
      uncertainty_center: 0.1332542767
      uncertainty_scale: 0.0643078377
      continuous_controller:
        mode: failure_accumulator_v2
        state:
          failure_decay: 0.60
          mastery_decay: 0.90
          initial_failure: 0.0
          initial_mastery: 0.50
        exploration:
          event_min: 0.05
          event_max: 0.65
          failure_threshold: 0.55
          failure_gain: 10.0
          uncertainty_weight: 0.0
          mastery_weight: 1.0
          surprise_weight: 0.0
          rise_rate: 0.80
          recovery_rate: 0.20
        range:
          global_min: 0.05
          global_max: 0.80
          failure_threshold: 0.75
          failure_gain: 12.0
          uncertainty_weight: 0.0
          mastery_weight: 0.0
          surprise_weight: 0.0
          rise_rate: 0.80
          recovery_rate: 0.20
        execution:
          enabled: true
          switch_scale: 0.20
      epsilon: 1.0e-12

  mapping_mod:
    class: src.Bayesian_state.model.modules.mapping.BinaryOrientationMappingModule
    kwargs:
      initial_probability: 0.5
      numerical_floor: 1.0e-12

  memory_mod:
    class: src.Bayesian_state.model.modules.memory.DualMemoryModule
    kwargs:
      gamma: 0.80
      w0: 0.15
      feedback_gain: 1.0

choice_readout:
  kwargs:
    method: expectation
    power: 1.0
    strategy_confidence_gain: 0.0

output_noise:
  kwargs:
    enabled: true
    base_lapse: 0.02
    post_error_lapse: 0.0
    low_accuracy_lapse: 0.0
    low_accuracy_threshold: 0.7
    recent_accuracy_window: 8
    lapse_decay: 0.0
    max_lapse: 1.0
    lapse_target: uniform
    latent_volatility_lapse: 0.0
    latent_volatility_power: 1.0

agenda:
  - perception_mod
  - hypo_transitions_mod
  - mapping_mod
  - memory_mod
  - beta_mod
