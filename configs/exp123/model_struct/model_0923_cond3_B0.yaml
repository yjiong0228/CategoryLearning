# Model 0923 B0: illustrative defaults, not fitted subject estimates.
provenance:
  model_id: model_0923
  variant: B0
  condition: 3
  specification_path: src/Bayesian_state/docs/model_architecture/model_0923.md
  specification_version: 0923-B0-v2
  scientific_status: behavioral_baseline_report_kernel_available_text_mapping_unvalidated
  hypothesis_space_status: adopted_axis_pair_overlap_128
  catalogue_adoption_basis: user_approved_structure_not_fit_comparison
  hypothesis_similarity:
    basis: boundary_fixed_labels
    version: mode_aware_assignment_agreement_v2
    hypothesis_space_version: continuous_axis_pair_overlap_0923_v1
    sample_count: 100000
    computation_seed: 0
    storage: runtime_cache_keyed_by_space_signature
    bundled_resource: none_recompute_for_128_rules
    interpretation: fixed_label_functional_agreement
  label_mapping:
    mode: fixed_task_labels
  pairing_initialization: uniform_per_rule_no_true_pairing_prior
partition:
  class: src.Bayesian_state.hypothesis_space.observation_model.continuous_partition.ContinuousPartition
  kwargs:
    n_dims: 4
    n_cats: 4
    structural_extension: axis_pair_overlap_0923
    similarity_n_samples: 100000
inference:
  backend: particle_filter
  particle_count: 32
  resample_threshold_fraction: 0.5
likelihood:
  distance_mode: boundary
  beta_source: action
  default_beta: 5.0
  feedback_likelihood_mode: hierarchical_pairing
modules:
  perception_mod:
    class: src.Bayesian_state.model.modules.perception.PerceptionModule
  beta_mod:
    class: src.Bayesian_state.model.modules.beta.BetaModule
    kwargs:
      beta_init: 5.0
      beta_min: 0.1
      beta_max: 25.0
      decrease_rate: 0.0
      increase_rate: 0.0
      beta_update_mode: hierarchical_feedback
      update_scope: active_hypotheses
      probabilistic_feedback_lapse: 0.0
      use_prior_scaling: false
      prior_beta_scale: 0.0
  hypo_transitions_mod:
    class: src.Bayesian_state.model.modules.hypothesis_transition.unified_rule_search.UnifiedRuleSearchHypothesisTransitionModule
    kwargs:
      capacity: 3
      tau_local: 0.1
      epsilon: 1.0e-12
      search_controller:
        baseline_probability: 0.05
        error_gain: 1.0
        global_search: 0.2
        failure_decay: 0.6
  memory_mod:
    class: src.Bayesian_state.model.modules.pairing_memory.HierarchicalPairingMemoryModule
    kwargs:
      gamma: 0.8
      w0: 0.0
      feedback_gain: 1.0
choice_readout:
  kwargs:
    method: expectation
    power: 1.0
    strategy_confidence_gain: 0.0
output_noise:
  kwargs:
    enabled: false
agenda:
- perception_mod
- hypo_transitions_mod
- memory_mod
- beta_mod
