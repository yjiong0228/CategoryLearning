# Focused mechanism probe after v8.
#
# Purpose:
# - keep v8's distribution-level selection objective;
# - focus on the v8 bottleneck subjects where volatility/history/accuracy failed;
# - test whether stronger feedback-contingent hypothesis refresh and
#   probabilistic feedback beta updates improve the posterior predictive checks.
base_sim_config_path: ../simulation_cfg/pmh_cond1_simulation.yaml

subject_range: [127, 132]

output_dir: ../../results/state-based-hyper-cd/pmh/cond1_v8_feedback_probe
objective_order:
  - path: simulation.mean_error
    rel_tolerance: 0.05
    abs_tolerance: 0.015
    scale_floor: 0.05
    anchor_guard: true
  - path: statistics.scores.distribution.multiobjective.score
    rel_tolerance: 0.05
    abs_tolerance: 0.001
    scale_floor: 0.01
    anchor_guard: true
save_level: compact
hyper_base_seed: 42

statistics_config:
  enabled: true
  mode: distribution_multiobjective
  primary_tolerance_abs: 0.015
  primary_tolerance_rel: 0.05

  run_choice_fraction: 0.10
  distribution_min_run_count: 64

  multiobjective_weights:
    accuracy_shape: 1.20
    history_kernel: 1.00
    switch_behavior: 0.25

  distribution_accept_acc_mae_max: 0.10
  distribution_accept_vol_ratio_min: 0.60
  distribution_accept_vol_ratio_max: 1.50
  distribution_accept_history_corr_min: 0.80
  distribution_accept_switch_score_max: 0.10

  accuracy_weight: 1.0
  volatility_weight: 0.06
  slope_weight: 0.03
  target_volatility_ratio: 1.0
  min_volatility_ratio: 0.000001

  history_max_lag: 8
  history_ridge: 0.001
  history_standardize: true
  history_kernel_weight: 1.0
  history_corr_weight: 0.05
  history_norm_weight: 0.0
  history_min_norm: 0.000001

  switch_weight: 0.5
  win_stay_weight: 1.0
  lose_shift_weight: 1.0
  perseveration_weight: 0.5
  min_switch_trials: 20

cd:
  n_restarts: 4
  max_outer_iters: 10
  init_strategy: random
  coordinate_order: shuffle_per_restart
  patience: 2
  min_delta: 0.001
  parallel_budget: 128

hyperparam_space:
  engine.modules.memory_mod.kwargs:
    values_product:
      gamma: [0.35, 0.50, 0.65, 0.80]
      w0: [0.015, 0.03, 0.06, 0.10, 0.15]

  engine.modules.hypo_transitions_mod.kwargs:
    values_from_json:
      path: ../../src/Bayesian_state/problems/modules/hypo_transition_strategies/hypo_transition_strategy_feedback_probe_candidates.json
      key: cond1_feedback_probe
      value_key: hypo_transitions_kwargs

  engine.modules.beta_mod.kwargs.beta_update_mode:
    values: [inferred_correct_category, probabilistic_feedback]
  engine.modules.beta_mod.kwargs.probabilistic_feedback_lapse:
    values: [0.0, 0.05, 0.10]
  engine.modules.beta_mod.kwargs.beta_init:
    values: [0.5, 0.8, 1.5, 3.0, 5.0]
  engine.modules.beta_mod.kwargs.decrease_rate:
    values: [0.15, 0.30, 0.50, 0.70, 0.90]
  engine.modules.beta_mod.kwargs.prior_beta_scale:
    values: [0.0, 5.0, 10.0, 20.0, 40.0]
  engine.modules.beta_mod.kwargs.correct_additive:
    values: [0.0, 0.25, 0.5, 1.0]

stages:
  coarse:
    cd_parallel:
      max_repeat_jobs: 128
    simulation_overrides:
      simulation_repeats: 256
      keep_logs: false
