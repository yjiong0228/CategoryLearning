# Single-stage coordinate-descent hyperparameter optimization for cond1.
# v7 keeps choice_brier / best10 as the primary hyper-CD objective, then applies
# a rank-based multiobjective secondary selection step. Within a near-optimal
# choice-loss gate, candidates are ranked jointly by:
#   1. global/local accuracy-curve shape,
#   2. feedback-history kernel,
#   3. exploration/perseveration/switch behavior.
#
# This is meant to test whether richer behavioral constraints shrink the
# near-optimal set without changing the underlying search grid.
base_sim_config_path: ../simulation_cfg/pmh_cond1_simulation.yaml

subject_range: [101, 132]

output_dir: ../../results/state-based-hyper-cd/pmh/cond1_v7
selection_metric: simulation.best10_mean_error
save_level: compact
hyper_base_seed: 42

# Final hyperparameter selection is two-tiered:
# 1. Keep candidates with choice-Brier best10 error close to the best candidate.
# 2. Within that gate, convert each secondary objective to a percentile rank
#    and minimize the weighted mean rank. This avoids raw-score scale dominance.
secondary_selection:
  enabled: true
  mode: multiobjective
  primary_tolerance_abs: 0.015
  primary_tolerance_rel: 0.05
  run_choice_fraction: 0.10

  multiobjective_weights:
    accuracy_shape: 1.0
    history_kernel: 1.0
    switch_behavior: 1.0

  # Accuracy-curve shape score:
  # accuracy_mae + volatility_weight * |log(pred_vol / true_vol)|
  #              + slope_weight * (1 - slope_agree)
  accuracy_weight: 1.0
  volatility_weight: 0.06
  slope_weight: 0.03
  target_volatility_ratio: 1.0
  min_volatility_ratio: 0.000001

  # Feedback-history kernel score.
  history_max_lag: 8
  history_ridge: 0.001
  history_standardize: true
  history_kernel_weight: 1.0
  history_corr_weight: 0.05
  history_norm_weight: 0.0
  history_min_norm: 0.000001

  # Switch/perseveration score uses probabilistic model stay/switch estimates:
  # switch t = 1 - P_model(choice_t == human_choice_{t-1}).
  # The conditioned terms are weighted more heavily than the global switch rate.
  switch_weight: 0.5
  win_stay_weight: 1.0
  lose_shift_weight: 1.0
  perseveration_weight: 0.5
  min_switch_trials: 20

cd:
  n_restarts: 8
  max_outer_iters: 16
  init_strategy: random
  coordinate_order: shuffle_per_restart
  patience: 2
  min_delta: 0.001
  parallel_budget: 128

hyperparam_space:
  # Recency-dominant memory with weak long-term anchoring.
  # Keep the v6 constrained grid so v7 isolates the effect of multiobjective
  # secondary selection rather than changing the search space at the same time.
  engine.modules.memory_mod.kwargs:
    values_product:
      gamma: [0.5, 0.6, 0.7, 0.8]
      w0: [0.03, 0.06, 0.1, 0.15]

  engine.modules.hypo_transitions_mod.kwargs:
    values_from_json:
      path: ../../src/Bayesian_state/problems/modules/hypo_transition_strategy_candidates.json
      key: cond1
      value_key: hypo_transitions_kwargs

  engine.modules.beta_mod.kwargs.beta_init:
    values: [0.8, 1.5, 3.0, 5.0, 8.0]
  engine.modules.beta_mod.kwargs.decrease_rate:
    values: [0.05, 0.15, 0.30, 0.50, 0.70]
  engine.modules.beta_mod.kwargs.prior_beta_scale:
    values: [0.0, 5.0, 10.0, 20.0, 40.0]
  engine.modules.beta_mod.kwargs.correct_additive:
    values: [0.0, 0.25, 0.5, 1.0, 2.0]

stages:
  coarse:
    cd_parallel:
      max_repeat_jobs: 128
    simulation_overrides:
      simulation_repeats: 128
      keep_logs: false
