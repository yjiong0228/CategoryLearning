# Detailed coordinate-descent hyperparameter optimization for all cond1 subjects.
# gamma/w0 are optimized jointly as one 6x6 product coordinate.
base_sim_config_path: ../simulation_cfg/pmh_cond1_simulation.yaml

subject_range: [101, 132]

output_dir: ../../results/state-based-hyper-cd/pmh/cond1_detailed
selection_metric: mean_simulation_error
hyperparam_selection_mode: per_subject
save_level: compact
hyper_base_seed: 42

cd:
  n_restarts: 8
  max_outer_iters: 8
  init_strategy: random
  coordinate_order: shuffle_per_restart
  patience: 2
  min_delta: 0.001
  parallel_budget: 64

hyperparam_space:
  engine.modules.memory_mod.kwargs:
    values_product:
      gamma: [0.2, 0.4, 0.7, 0.9]
      w0: [0.02, 0.06, 0.2, 0.8]

  engine.modules.hypo_transitions_mod.kwargs:
    values_from_json:
      path: ../../src/Bayesian_state/problems/modules/hypo_transition_strategy_candidates.json
      key: cond1
      value_key: hypo_transitions_kwargs

  engine.modules.beta_mod.kwargs.beta_init:
    values: [0.8, 1.5, 3.0, 5.0]
  engine.modules.beta_mod.kwargs.decrease_rate:
    values: [0.05, 0.15, 0.30, 0.50]
  engine.modules.beta_mod.kwargs.prior_beta_scale:
    values: [0.0, 5.0, 10.0, 20.0]
  engine.modules.beta_mod.kwargs.correct_additive:
    values: [0.0, 0.25, 0.5, 1.0]
  engine.modules.likelihood_mod.kwargs.distance_mode:
    values: [prototype, boundary]

stages:
  coarse:
    cd_parallel:
      max_repeat_jobs: 16
    simulation_overrides:
      simulation_repeats: 16
      keep_logs: false

  fine:
    cd_parallel:
      max_repeat_jobs: 32
    simulation_overrides:
      simulation_repeats: 32
      keep_logs: false

refine_policy:
  top_k: 8
  expand:
    engine.modules.memory_mod.kwargs:
      values_product:
        gamma: [0.25, 0.40, 0.55, 0.70, 0.80, 0.90]
        w0: [0.005, 0.01, 0.02, 0.06, 0.15, 0.25, 0.50, 0.90]
