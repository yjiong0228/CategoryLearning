# Single-stage coordinate-descent hyperparameter optimization for cond1.
# v6 keeps choice_brier / best10 as the primary hyper-CD objective, then applies
# a memory-sensitive secondary objective: among candidates whose primary
# choice loss is close to the best candidate, select the one whose feedback-history
# kernel best matches the subject's empirical history kernel.
# This keeps gamma/w0 as individual-level memory traits, but constrains them via
# sequential feedback dependence rather than only global choice/accuracy fit.
base_sim_config_path: ../simulation_cfg/pmh_cond1_simulation.yaml

subject_range: [101, 132]

output_dir: ../../results/state-based-hyper-cd/pmh/cond1_v6
objective_order:
  - path: simulation.best10_mean_error
    rel_tolerance: 0.05
    abs_tolerance: 0.015
    scale_floor: 0.05
    anchor_guard: true
  - path: statistics.scores.history_kernel.value
    rel_tolerance: 0.05
    abs_tolerance: 0.001
    scale_floor: 0.01
    anchor_guard: true
save_level: compact
hyper_base_seed: 42

# objective_order compares choice-Brier best10 first, then feedback-history-kernel
# mismatch. statistics_config controls how the history-kernel score is computed.
statistics_config:
  enabled: true
  mode: history_kernel
  primary_tolerance_abs: 0.015
  primary_tolerance_rel: 0.05
  run_choice_fraction: 0.10
  history_max_lag: 8
  history_ridge: 0.001
  history_standardize: true
  history_kernel_weight: 1.0
  history_corr_weight: 0.05
  history_norm_weight: 0.0

  # Retained for compatibility and for logging accuracy-shape diagnostics.
  accuracy_weight: 1.0
  volatility_weight: 0.03
  slope_weight: 0.02
  target_volatility_ratio: 1.0
  min_volatility_ratio: 0.000001

cd:
  n_restarts: 8
  max_outer_iters: 16
  init_strategy: random
  coordinate_order: shuffle_per_restart
  patience: 2
  min_delta: 0.001
  parallel_budget: 128

hyperparam_space:
  # Recency-dominant memory with weak long-term anchoring.
  # The full v4 grid showed a broad near-optimal plateau, so v5 constrains
  # gamma/w0 to values that are easier to interpret theoretically.
  engine.modules.memory_mod.kwargs:
    values_product:
      gamma: [0.5, 0.6, 0.7, 0.8]
      w0: [0.03, 0.06, 0.1, 0.15]

  engine.modules.hypo_transitions_mod.kwargs:
    values_from_json:
      path: ../../src/Bayesian_state/problems/modules/hypo_transition_strategy_candidates.json
      key: cond1
      value_key: hypo_transitions_kwargs

  engine.modules.beta_mod.kwargs.beta_init:
    values: [0.8, 1.5, 3.0, 5.0, 8.0]
  engine.modules.beta_mod.kwargs.decrease_rate:
    values: [0.05, 0.15, 0.30, 0.50, 0.70]
  engine.modules.beta_mod.kwargs.prior_beta_scale:
    values: [0.0, 5.0, 10.0, 20.0, 40.0]
  engine.modules.beta_mod.kwargs.correct_additive:
    values: [0.0, 0.25, 0.5, 1.0, 2.0]

stages:
  coarse:
    cd_parallel:
      max_repeat_jobs: 128
    simulation_overrides:
      simulation_repeats: 128
      keep_logs: false
