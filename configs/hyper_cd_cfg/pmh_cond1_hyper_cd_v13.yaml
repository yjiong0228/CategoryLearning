# v13 Cond1 hyper-CD config.
# Beta is fixed in the model config; CD optimizes only memory and profile/readout candidates.
base_sim_config_path: ../simulation_cfg/pmh_cond1_simulation_v13.yaml

# Representative Cond1 subset selected from window-16 accuracy curves.
# Volatile / deep-valley: 103, 111, 118, 131.
# Distinct non-volatile shapes: 105, 112, 117, 127.
subjects: [103, 105, 111, 112, 117, 118, 127, 131]

output_dir: ../../results/state-based-hyper-cd/pmh/cond1_v13_selected8
objective_order:
  - path: statistics.loss.choice_brier.best25_mean
    rel_tolerance: 0.03
    abs_tolerance: 0.001
    scale_floor: 0.01
    anchor_guard: true
  - path: statistics.loss.accuracy_curve_berhu.best25_mean
    rel_tolerance: 0.05
    abs_tolerance: 0.005
    scale_floor: 0.01
    anchor_guard: true

save_level: compact
hyper_base_seed: 42
loss_metric: accuracy_curve_berhu
loss_delta: 0.10
window_size: 16

statistics_config:
  enabled: true
  mode: distribution_ppc_interval
  primary_tolerance_abs: 0.015
  primary_tolerance_rel: 0.05
  run_choice_fraction: 0.10
  distribution_min_run_count: 32
  distribution_interval_alpha: 0.10

cd:
  n_restarts: 6
  max_outer_iters: 8
  init_strategy: random
  coordinate_order: shuffle_per_restart
  patience: 2
  min_delta: 0.001
  parallel_budget: 64

hyperparam_space:
  engine.modules.memory_mod.kwargs:
    values_product:
      gamma: [0.25, 0.50, 0.70, 0.85, 0.95]
      w0: [0.01, 0.05, 0.10, 0.20, 0.50]

  engine.modules.hypo_transitions_mod.kwargs:
    values_from_json:
      path: ../../src/Bayesian_state/problems/modules/hypo_transition_strategies/hypo_transition_profile_v13_candidates.json
      key: cond1_v13
      value_key: hypo_transitions_kwargs

  engine.choice_readout.kwargs:
    values:
      - method: expectation
      - method: map_hypothesis

stages:
  coarse:
    cd_parallel:
      max_repeat_jobs: 16
    simulation_overrides:
      simulation_repeats: 256
      keep_logs: false
      loss_metric: accuracy_curve_berhu
      loss_delta: 0.10
      window_size: 16
  fine:
    cd_parallel:
      max_repeat_jobs: 16
    simulation_overrides:
      simulation_repeats: 512
      keep_logs: false
      loss_metric: accuracy_curve_berhu
      loss_delta: 0.10
      window_size: 16
