# One-step feedback-reactive H under the frozen Model 0815 common architecture.
# Subject-specific controller values are projected from the adaptive branch's
# first 32 trials by the nested-comparison runner; these defaults are only a
# valid standalone template.

provenance:
  model_id: model0815_h3_feedback_reactive
  parent_model_id: model0815_h1_adaptive_controller
  architecture_profile: h3_feedback_reactive_unified_dynamic_beta
  scientific_status: provisional_h_controller_compression_screen
  label_mapping:
    mode: fixed_task_labels
  workspace_capacity:
    value: 3
    scope: cohort_common_working_anchor
  mandatory_mechanisms:
    perception: enabled
    fading_memory: enabled
    unified_dynamic_beta: enabled
    bounded_hypothesis_search: enabled
  optional_mechanisms:
    one_step_feedback_reactive_search: enabled_for_screen
    accumulated_failure_mastery_controller: disabled
    static_memory_channel: disabled
    persistent_execution: disabled
    strategy_confidence: disabled
    output_lapse: disabled

partition:
  class: src.Bayesian_state.hypothesis_space.observation_model.continuous_partition.ContinuousPartition
  kwargs:
    n_dims: 4
    n_cats: 2

inference:
  backend: particle_filter
  particle_count: 32
  resample_threshold_fraction: 0.5

likelihood:
  distance_mode: boundary
  beta_source: action
  default_beta: 5.0

modules:
  perception_mod:
    class: src.Bayesian_state.model.modules.perception.PerceptionModule

  beta_mod:
    class: src.Bayesian_state.model.modules.beta.BetaModule
    kwargs:
      beta_init: 5.0
      beta_min: 0.1
      beta_max: 25.0
      decrease_rate: 0.15
      correct_additive: 1.0
      beta_update_mode: probabilistic_feedback
      update_scope: active_hypotheses
      probabilistic_feedback_lapse: 0.0
      use_prior_scaling: false
      prior_beta_scale: 0.0

  hypo_transitions_mod:
    class: src.Bayesian_state.model.modules.hypothesis_transition.feedback_reactive.FeedbackReactiveHypothesisTransitionModule
    kwargs:
      capacity: 3
      feedback_reactive_controller:
        event_after_correct: 0.25
        event_after_error: 0.35
        initial_event_probability: 0.25
        global_search: 0.20
      prior_assignment:
        method: pairwise_mass_transfer
      epsilon: 1.0e-12

  memory_mod:
    class: src.Bayesian_state.model.modules.memory.DualMemoryModule
    kwargs:
      gamma: 0.80
      w0: 0.0
      feedback_gain: 1.0

choice_readout:
  kwargs:
    method: expectation
    power: 1.0
    strategy_confidence_gain: 0.0

output_noise:
  kwargs:
    enabled: true
    base_lapse: 0.0
    post_error_lapse: 0.0
    low_accuracy_lapse: 0.0
    low_accuracy_threshold: 0.7
    recent_accuracy_window: 8
    lapse_decay: 0.0
    max_lapse: 1.0
    lapse_target: uniform
    latent_volatility_lapse: 0.0
    latent_volatility_power: 1.0

agenda:
  - perception_mod
  - hypo_transitions_mod
  - memory_mod
  - beta_mod
