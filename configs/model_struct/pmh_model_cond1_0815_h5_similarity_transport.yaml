# Current Model 0815 H architecture.  H5 keeps the H4 nested search controller
# but replaces arbitrary dropped-newcomer mass copying with parameter-free
# similarity transport.  H4 remains unchanged so its existing audits retain
# their original generating configuration.

provenance:
  model_id: model0815_h5_similarity_transport
  parent_model_id: model0815_h4_nested_feedback_accumulator
  architecture_profile: h5_similarity_transport_nested_accumulator_dynamic_beta
  scientific_status: implemented_unfitted_similarity_transport
  label_mapping:
    mode: fixed_task_labels
  hypothesis_similarity:
    basis: boundary_fixed_labels
    version: shared_hypothesis_space_v1
    sample_count: 100000
    # This frozen resource predates explicit seed recording, so its file hash
    # is the authoritative identity.  Any newly computed fallback uses seed 0.
    resource_generation_seed: not_recorded
    fallback_computation_seed: 0
    resource_filename: similarity_matrix_shared_hypothesis_space_v1_d4_c2_n100000_pairtol0p1_centertol0p1.npy
    resource_sha256: 0e75c695d24473e7c8a03831c3b6527946c36d274d1b0b3ec927c1c7be0fbdd2
    interpretation: fixed_label_functional_agreement
    tau_scope: common_fixed_architecture
  workspace_capacity:
    value: 3
    scope: subject_level_discrete_candidate
  mandatory_mechanisms:
    perception: enabled
    fading_memory: enabled
    unified_dynamic_beta: enabled
    bounded_hypothesis_search: enabled
    similarity_transport_prior: enabled
  optional_mechanisms:
    immediate_feedback_reactivity: subject_parameterized
    accumulated_failure_effect: exact_zero_boundary_available
    dynamic_global_search: exact_zero_boundary_available
    persistent_execution: subject_level_binary_candidate_default_off
    static_memory_channel: disabled
    strategy_confidence: disabled
    output_lapse: disabled

partition:
  class: src.Bayesian_state.hypothesis_space.observation_model.continuous_partition.ContinuousPartition
  kwargs:
    n_dims: 4
    n_cats: 2

inference:
  backend: particle_filter
  particle_count: 32
  resample_threshold_fraction: 0.5

likelihood:
  distance_mode: boundary
  beta_source: action
  default_beta: 5.0

modules:
  perception_mod:
    class: src.Bayesian_state.model.modules.perception.PerceptionModule

  beta_mod:
    class: src.Bayesian_state.model.modules.beta.BetaModule
    kwargs:
      beta_init: 5.0
      beta_min: 0.1
      beta_max: 25.0
      decrease_rate: 0.15
      # Exact reparameterization of legacy correct_additive=1 at beta_max=25.
      increase_rate: 0.04
      beta_update_mode: probabilistic_feedback
      update_scope: active_hypotheses
      probabilistic_feedback_lapse: 0.0
      use_prior_scaling: false
      prior_beta_scale: 0.0

  hypo_transitions_mod:
    class: src.Bayesian_state.model.modules.hypothesis_transition.nested_feedback_accumulator.NestedFeedbackAccumulatorHypothesisTransitionModule
    kwargs:
      capacity: 3
      # Common fixed architecture scale.  It is deliberately not a
      # subject-level coordinate because tau_local and global_search can both
      # broaden the newcomer proposal toward the global kernel.
      tau_local: 0.10
      nested_feedback_accumulator_controller:
        event_after_correct: 0.25
        event_after_error: 0.35
        initial_event_probability: 0.25
        global_search: 0.20
        accumulator_decay: 0.60
        # c_acc = 0 is exactly the feedback-reactive event-controller boundary.
        accumulator_logit_gain: 0.0
        # c_g = 0 keeps the conditional global-search probability fixed.
        # Positive values reuse F_t: g_t = g_0 + (1-g_0) * c_g * F_t.
        global_search_failure_gain: 0.0
        initial_failure: 0.0
      # No method-specific fitted parameters.  The transport fraction is the
      # realized K_t / capacity and the semantic component reuses g_t and the
      # fixed local similarity kernel.
      prior_assignment:
        method: similarity_transport
      # Subject-level binary structural coordinate.  Keep switch_scale fixed
      # so execution-on does not introduce a second continuous flexibility.
      # A subject fit may override only `enabled` to true.
      persistent_execution:
        enabled: false
        switch_scale: 0.20
      epsilon: 1.0e-12

  memory_mod:
    class: src.Bayesian_state.model.modules.memory.DualMemoryModule
    kwargs:
      gamma: 0.80
      w0: 0.0
      feedback_gain: 1.0

choice_readout:
  kwargs:
    method: expectation
    power: 1.0
    strategy_confidence_gain: 0.0

output_noise:
  kwargs:
    enabled: true
    base_lapse: 0.0
    post_error_lapse: 0.0
    low_accuracy_lapse: 0.0
    low_accuracy_threshold: 0.7
    recent_accuracy_window: 8
    lapse_decay: 0.0
    max_lapse: 1.0
    lapse_target: uniform
    latent_volatility_lapse: 0.0
    latent_volatility_power: 1.0

agenda:
  - perception_mod
  - hypo_transitions_mod
  - memory_mod
  - beta_mod
