# Explicit frozen full-hypothesis-set C1 configuration.
# This file avoids relying on run-script overrides of the active_set template.

partition:
  class: src.Bayesian_state.hypothesis_space.observation_model.continuous_partition.ContinuousPartition
  kwargs:
    n_dims: 4
    n_cats: 2

likelihood:
  distance_mode: prototype

modules:
  perception_mod:
    class: src.Bayesian_state.model.modules.perception.PerceptionModule

  beta_mod:
    class: src.Bayesian_state.model.modules.beta.BetaModule
    kwargs:
      beta_init: 5.0
      beta_min: 0.1
      beta_max: 25.0
      decrease_rate: 0.15
      correct_additive: 0.50
      beta_update_mode: probabilistic_feedback
      probabilistic_feedback_lapse: 0.0
      use_prior_scaling: false
      prior_beta_scale: 0.0

  hypo_transitions_mod:
    class: src.Bayesian_state.model.modules.hypothesis_transition.fixed_strategy.FixedFeedbackSwapHypothesisTransitionModule
    kwargs:
      capacity: 38
      theta: 0.0
      tie_atol: 1.0e-12

  memory_mod:
    class: src.Bayesian_state.model.modules.memory.DualMemoryModule
    kwargs:
      gamma: 0.55
      w0: 0.10
      feedback_gain: 1.0

choice_readout:
  kwargs:
    method: sharpened_expectation
    power: 2.0

output_noise:
  kwargs:
    enabled: true
    base_lapse: 0.0
    post_error_lapse: 0.0
    low_accuracy_lapse: 0.0
    low_accuracy_threshold: 0.70
    recent_accuracy_window: 8
    lapse_decay: 0.0
    max_lapse: 1.0
    lapse_target: uniform
    latent_volatility_lapse: 0.0
    latent_volatility_power: 1.0

agenda:
  - perception_mod
  - hypo_transitions_mod
  - memory_mod
  - beta_mod
