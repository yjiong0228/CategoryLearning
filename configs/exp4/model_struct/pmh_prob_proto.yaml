data:
  subject_column: iSub
  condition_column: condition
  feature_columns: [feature1, feature2, feature3, feature4]
  target_type: probabilistic
  probability_columns: [probCat1, probCat2]

partition:
  class: 'src.Bayesian_state.hypothesis_space.observation_model.continuous_partition.ContinuousPartition'
  kwargs:
    n_dims: 4
    n_cats: 2

likelihood:
  distance_mode: prototype
  feedback_likelihood_mode: bernoulli_choice
  feedback_lapse: 0.05

modules:
  perception_mod:
    class: 'src.Bayesian_state.model.modules.perception.PerceptionModule'
    kwargs:
      noise_mode: uniform
  beta_mod:
    class: 'src.Bayesian_state.model.modules.beta.BetaModule'
    kwargs:
      beta_init: 3.0
      beta_min: 0.1
      beta_max: 30.0
      decrease_rate: 0.15
      correct_additive: 0.8
      use_prior_scaling: true
      prior_beta_scale: 6.0
      beta_update_mode: probabilistic_feedback
      probabilistic_feedback_lapse: 0.05
  hypo_transitions_mod:
    class: 'src.Bayesian_state.model.modules.hypothesis_transition.fixed_strategy.FixedStrategyHypothesisTransitionModule'
    kwargs:
      strategies:
        - {label: "retain_random", amount: "random_4", method: "random_posterior", pool: "active"}
        - {label: "explore_random", amount: "opp_random_4", method: "random", pool: "inactive"}
      init_num: 4
      max_active_hypotheses: 8
  memory_mod:
    class: 'src.Bayesian_state.model.modules.memory.DualMemoryModule'
    kwargs:
      w0: 0.45
      gamma: 0.96

agenda:
  - perception_mod
  - hypo_transitions_mod
  - memory_mod
  - beta_mod
