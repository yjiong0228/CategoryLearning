# Two-layer hyper-optimization (Coordinate Descent) for cond2
# Outer optimizer: coordinate descent over model hyperparameters
# Inner optimizer: existing grid optimizer over memory params (gamma/w0)
inner_optimizer: grid
inner_base_config_path: ../grid_opt_cfg/pmh_cond2.yaml

subject_range: [201, 232]

output_dir: ../../results/state-based-hyper-opt/pmh/cond2_cd
selection_metric: min_inner_mean_error
hyperparam_selection_mode: per_subject
save_level: compact
random_seed: 42

# CD controls. The inner optimizer uses 128 cores; CD itself stays sequential
# so that restart order, cache reuse, and random seeds remain reproducible.
cd:
  n_restarts: 5
  max_outer_iters: 8
  init_strategy: random
  coordinate_order: shuffle_each_iter
  patience: 2
  min_delta: 0.001

hyperparam_space:
  inner.window_size:
    values: [32, 16, 8]

  # Cond2/3 strategy templates centered on entropy + ksimilar association.
  engine.modules.hypo_transitions_mod.kwargs.strategies:
    values:
      # T1: cond2/3 baseline
      - [
          {amount: "entropy_7", method: "random_posterior"},
          {amount: "fixed", method: "ksimilar_centers", value: 1, proto_hypo_amount: 1, proto_hypo_method: "top", cluster_hypo_method: "top"},
          {amount: "opp_entropy_7", method: "random"}
        ]
      # T2: no explicit associative expansion
      - [
          {amount: "entropy_7", method: "random_posterior"},
          {amount: "opp_entropy_7", method: "random"}
        ]
      # T3: conservative entropy + conservative opposite exploration
      - [
          {amount: "entropy_5", method: "random_posterior"},
          {amount: "fixed", method: "ksimilar_centers", value: 1, proto_hypo_amount: 1, proto_hypo_method: "top", cluster_hypo_method: "top"},
          {amount: "opp_entropy_4", method: "random"}
        ]
      # T4: association-heavy, one top prototype to two similar centers
      - [
          {amount: "entropy_7", method: "random_posterior"},
          {amount: "fixed", method: "ksimilar_centers", value: 2, proto_hypo_amount: 1, proto_hypo_method: "top", cluster_hypo_method: "top"},
          {amount: "opp_entropy_4", method: "random"}
        ]
      # T5: association-heavy, two prototypes to two similar centers
      - [
          {amount: "entropy_7", method: "random_posterior"},
          {amount: "fixed", method: "ksimilar_centers", value: 2, proto_hypo_amount: 2, proto_hypo_method: "top", cluster_hypo_method: "top"},
          {amount: "opp_entropy_4", method: "random"}
        ]
      # T6: confidence-gated retention and exploration
      - [
          {amount: "confidence_7", method: "random_posterior"},
          {amount: "fixed", method: "ksimilar_centers", value: 1, proto_hypo_amount: 1, proto_hypo_method: "top", cluster_hypo_method: "top"},
          {amount: "opp_confidence_7", method: "random"}
        ]
      # T7: confidence/top-posterior leaning
      - [
          {amount: "max_7", method: "random_posterior"},
          {amount: "fixed", method: "ksimilar_centers", value: 1, proto_hypo_amount: 1, proto_hypo_method: "top", cluster_hypo_method: "top"},
          {amount: "opp_entropy_7", method: "random"}
        ]
      # T8: stochastic retention plus associative expansion
      - [
          {amount: "random_7", method: "random_posterior"},
          {amount: "fixed", method: "ksimilar_centers", value: 1, proto_hypo_amount: 1, proto_hypo_method: "top", cluster_hypo_method: "top"},
          {amount: "opp_random_7", method: "random"}
        ]
      # T9: fixed posterior retention plus light random exploration
      - [
          {amount: "fixed", method: "top_posterior", top_p: 0.70, value: 3},
          {amount: "fixed", method: "ksimilar_centers", value: 1, proto_hypo_amount: 1, proto_hypo_method: "top", cluster_hypo_method: "top"},
          {amount: "fixed", method: "random", value: 2}
        ]

  engine.modules.hypo_transitions_mod.kwargs.max_active_hypotheses:
    values: [7, 10, 12]
  engine.modules.hypo_transitions_mod.kwargs.init_num:
    values: [7, 10, 15]

  engine.modules.beta_mod.kwargs.beta_init:
    values: [0.8, 1.5, 3.0]
  engine.modules.beta_mod.kwargs.decrease_rate:
    values: [0.1, 0.2, 0.3]
  engine.modules.beta_mod.kwargs.prior_beta_scale:
    values: [5.0, 10.0, 15.0]

stages:
  coarse:
    inner_overrides:
      n_repeats: 16
      refit_repeats: 32
      keep_logs: false
      n_jobs: 128
      param_grid:
        gamma: [0.2, 0.6, 0.9]
        w0: [0.02, 0.1, 0.3]

  fine:
    inner_overrides:
      n_repeats: 32
      refit_repeats: 128
      keep_logs: false
      n_jobs: 128
      param_grid:
        gamma: [0.2, 0.4, 0.6, 0.8, 0.95]
        w0: [0.01, 0.03, 0.08, 0.15, 0.3]

refine_policy:
  top_k: 8
loss_metric: accuracy_mse

