inner_optimizer: grid
inner_base_config_path: ../grid_opt_cfg/pmh_cond1.yaml
output_dir: ../../results/state-based-hyper-opt/cd_example

selection_metric: min_inner_mean_error
hyperparam_selection_mode: per_subject
save_level: compact
random_seed: 1234

subjects: [125]

cd:
  n_restarts: 3
  max_outer_iters: 4
  init_strategy: random
  coordinate_order: shuffle_each_iter
  patience: 2
  min_delta: 0.0

refine_policy:
  top_k: 3

stages:
  coarse:
    inner_overrides:
      n_repeats: 1
      refit_repeats: 0
      param_grid:
        gamma: [0.2, 0.6, 0.9]
        w0: [0.02, 0.1, 0.3]
  fine:
    inner_overrides:
      n_repeats: 2
      refit_repeats: 4
      param_grid:
        gamma: [0.2, 0.4, 0.6, 0.8, 0.95]
        w0: [0.01, 0.03, 0.08, 0.15, 0.3]

hyperparam_space:
  inner.window_size:
    values: [32, 16, 8]
  engine.modules.hypo_transitions_mod.kwargs.max_active_hypotheses:
    values: [2, 3, 4]
  engine.modules.beta_mod.kwargs.beta_init:
    values: [0.8, 1.5, 3.0]
