analysis_id: model_0815_p0_calibrated_pf_nested_convergence_pilot_v1
scope: single_subject_nested_particle_and_seed_ensemble_convergence

base_simulation_config: configs/simulation_cfg/model0815_p0_cond1_calibrated.yaml
output_dir: results/model_dynamic_adaptive_control/0815_p0/pf_convergence/nested_pilot_s103_v1

pilot:
  subjects: [103]
  particle_seed_budget:
    256: 16
    512: 8
  nested_seed_counts:
    256: [4, 8, 16]
    512: [4, 8]
  max_trials: 64
  base_seed: 20260816
  n_jobs: 8

  comparisons:
    - comparison_id: R256_vs_R512_at_K8
      comparison_role: same_seed_count
      left: {particle_count: 256, seed_count: 8}
      right: {particle_count: 512, seed_count: 8}
    - comparison_id: R256K16_vs_R512K8
      comparison_role: matched_total_particle_trajectories
      left: {particle_count: 256, seed_count: 16}
      right: {particle_count: 512, seed_count: 8}

  stability_gates:
    maximum_choice_nll_change: 0.002
    maximum_choice_probability_rmse: 0.010
    maximum_executed_posterior_js: 0.020
    maximum_split_half_choice_probability_rmse: 0.010
    maximum_split_half_executed_posterior_js: 0.020
    minimum_median_post_choice_ess_fraction: 0.20

reference_reproduction:
  particle_count_summary: results/model_dynamic_adaptive_control/0815_p0/pf_convergence/calibrated_128_256_v1/particle_count_summary.csv
  subject_id: 103
  particle_count: 256
  seed_count: 8
  absolute_tolerance: 1.0e-12
