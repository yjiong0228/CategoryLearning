  total_filter_seed_repeats: 16
  aggregation_seed_counts: [2, 4, 8, 16]
  training_seed_indices: [0, 1, 2, 3, 4, 5, 6, 7]
  validation_seed_indices: [8, 9, 10, 11, 12, 13, 14, 15]
  resample_threshold_fraction: 0.5
  base_seed: 20260814
  n_jobs: 16
  bootstrap_repeats: 2000
  bootstrap_confidence: 0.95
  equivalence_rule: paired_bootstrap_delta_nll_interval_includes_zero
