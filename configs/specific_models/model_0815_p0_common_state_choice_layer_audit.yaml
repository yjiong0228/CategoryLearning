analysis_id: model_0815_p0_common_state_choice_layer_audit_20260816_v1
scope: p0_boundary_common_state_choice_layer_screen

# Historical development-anchor audit. This base config does not inline the
# subsequently selected default_beta=10 and beta_max=50 values; retain this
# result for directional comparison only and do not treat it as calibrated P0.
base_simulation_config: configs/simulation_cfg/model0815_p0_cond1_beta_recalibration.yaml
# The old exact-no-op check is architecture-level: with one persistent
# executed rule, hypothesis-weight sharpening cannot alter its readout.
phase0_probe_summary: results/model_dynamic_adaptive_control/0813_pf/mechanism_audit/00_reachability/probe_summary.csv
output_dir: results/model_dynamic_adaptive_control/0815_p0/mechanism_audit/01_common_state_choice_layer

design:
  subjects: [103, 104, 105, 108, 111, 120, 124, 132]
  trials_per_subject: 64
  particle_count: 128
  total_filter_seed_repeats: 8
  training_seed_indices: [0, 1, 2, 3]
  validation_seed_indices: [4, 5, 6, 7]
  resample_threshold_fraction: 0.5
  base_seed: 20260816
  filter_seed_role: model0815_p0_common_state_choice_layer_audit
  n_jobs: 8
  bootstrap_repeats: 2000
  bootstrap_confidence: 0.95

  # This value is used only by an audit readout. The fitted M0 remains gain=0,
  # and gain=2 never changes PF weights, resampling, or cognitive states.
  counterfactual_strategy_confidence_gain: 2.0

  comparisons:
    - contrast_id: persistent_execution
      mechanism_id: COG-09
      comparator_layer: active_unsharpened
      mechanism_layer: executed_no_strategy
      interpretation_role: common_state_execution_readout_screen
    - contrast_id: strategy_confidence_under_execution
      mechanism_id: OBS-02
      comparator_layer: executed_no_strategy
      mechanism_layer: executed_counterfactual_strategy
      interpretation_role: common_state_gain2_vs_gain0_screen
    - contrast_id: uniform_output_lapse
      mechanism_id: OBS-03
      comparator_layer: executed_no_strategy
      mechanism_layer: fitted_with_lapse
      interpretation_role: common_state_lapse002_vs_zero_screen

  stability_gates:
    minimum_train_validation_subject_spearman: 0.70
    minimum_subject_sign_agreement: 0.75
    require_aggregate_sign_agreement: true
    maximum_median_paired_mean_nll_mcse: 0.001

  practical_effect_rule:
    baseline_mean_nll_fraction: 0.01
    paired_seed_sd_multiplier: 2.0

interpretation:
  calibration_status: development_anchor_before_selected_beta_values_were_frozen
  primary_estimand: instantaneous choice-readout delta NLL on identical pre-choice M0 PF states
  positive_effect: comparator mean NLL minus mechanism mean NLL
  not_a_full_counterfactual: alternative readouts do not update subsequent particle weights or cognitive states
  model_boundary: boundary_distance_fixed_evidence_beta_capacity3_fixed_mapping
  independent_unit: subject_for_descriptive_pilot_heterogeneity_pf_seeds_are_technical_repeats

report:
  language: zh-CN
  readme_title: "0815 P0：common-state choice-layer 配对复核"
  figure_png: choice_layer_paired_audit.png
