analysis_id: model_0815_p0_persistent_execution_counterfactual_pilot_v1
scope: calibrated_boundary_persistent_execution_three_model_counterfactual

base_simulation_config: configs/simulation_cfg/model0815_p0_cond1_calibrated.yaml
output_dir: results/model_dynamic_adaptive_control/0815_p0/mechanism_audit/02_persistent_execution_counterfactual_pilot

design:
  # This is a mechanism-design pilot, not the eight-subject structural screen.
  # These three subjects are the already frozen numerical panel and are not
  # selected from the execution results.
  subjects: [103, 120, 127]
  trials_per_subject: 64
  # Provisional paired-comparison budget. This is deliberately not presented
  # as the final PF count; absolute convergence is deferred until the model
  # architecture is frozen.
  particle_count: 128
  seed_count_by_subject:
    103: 8
    120: 8
    127: 8
  base_seed: 20260817
  n_jobs: 8

  # A direct execution on/off comparison would also change beta update scope,
  # because executed_hypothesis scope is undefined when execution is off.
  # The three-model bank separates that interaction explicitly.
  variants:
    - variant_id: execution_off_active_beta
      persistent_execution_enabled: false
      beta_update_scope: active_hypotheses
      role: minimal_workspace_baseline
    - variant_id: execution_on_active_beta
      persistent_execution_enabled: true
      beta_update_scope: active_hypotheses
      role: execution_add_one
    - variant_id: execution_on_executed_beta
      persistent_execution_enabled: true
      beta_update_scope: executed_hypothesis
      role: current_p0_bundle

  contrasts:
    - contrast_id: persistent_execution_main
      comparator_variant: execution_off_active_beta
      mechanism_variant: execution_on_active_beta
      interpretation: execution_effect_with_beta_scope_held_active
    - contrast_id: executed_beta_scope_given_execution
      comparator_variant: execution_on_active_beta
      mechanism_variant: execution_on_executed_beta
      interpretation: beta_scope_effect_with_execution_held_on
    - contrast_id: current_execution_bundle
      comparator_variant: execution_off_active_beta
      mechanism_variant: execution_on_executed_beta
      interpretation: current_execution_plus_rule_specific_beta_total_effect

  # These gates concern the paired mechanism contrast, not absolute PF output
  # convergence. Future extensions may increase K separately by subject while
  # retaining the same thresholds and nested seed prefix.
  numerical_gates:
    maximum_paired_mean_nll_mcse: 0.001
    maximum_disjoint_half_delta_difference: 0.003

  practical_effect_rule:
    baseline_mean_nll_fraction: 0.01
    paired_seed_sd_multiplier: 2.0

interpretation:
  positive_delta: comparator_mean_nll_minus_mechanism_mean_nll
  primary_estimand: paired_full_counterfactual_mean_choice_nll_difference
  model_status: provisional_architecture_screen_before_final_recalibration
  mapping: fixed_task_labels_no_orientation_learning
  parameter_policy: freeze_current_calibrated_common_beta_values
  not_claimed: final_mechanism_decision_or_final_pf_budget
