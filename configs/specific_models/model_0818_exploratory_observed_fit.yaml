analysis_id: model_0818_cond1_exploratory_observed_fit_pre_recovery_v2
scope: exploratory_observed_fit_before_parameter_and_module_recovery

parameter_space: configs/specific_models/model_0818_cond1_parameter_space.yaml
base_simulation_config: configs/simulation_cfg/model0818_cond1_exploratory_observed_fit.yaml
output_dir: results/model_0818/cond1/exploratory_observed_fit_pre_recovery_v2
subjects: [101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114, 115, 116, 117, 118, 119, 120, 121, 122, 123, 124, 125, 126, 127, 128, 129, 130, 131, 132]
hyper_base_seed: 20260821
window_size: 16
resample_threshold_fraction: 0.5

authorization:
  user_authorized_observed_fit: true
  observed_choices_used: true
  exploratory_only: true
  formal_parameter_inference_authorized: false
  formal_module_inference_authorized: false
  manuscript_result_authorized: false

# The first 64 trials provide one identically sized early-learning window for
# all 32 subjects. Full sequences range from 64 to 768 trials and are outside
# this first-look computation.
trial_scope:
  mode: first_n_trials_per_subject
  max_trials: 64
  condition: 1
  include_ambiguous_trials: true

model_scope:
  architecture: PMH
  perception_parameters: subject_specific_fixed_external
  subject_parameters: [workspace_execution, gamma, E_C, delta_E, g_0, c_A, c_G, beta_0, eta_plus, eta_minus]
  explicit_zero_parameters: [delta_E, c_A, c_G]

optimization:
  method: two_start_one_sweep_block_coordinate_then_high_precision_rescore
  common_random_numbers_within_candidate_comparisons: true
  search:
    particle_count: 32
    filter_seed_count: 4
    max_outer_iters: 1
    shortlist_size: 4
    interpretation: noisy_exploratory_screen_not_final_score
  final_rescore:
    particle_count: 128
    filter_seed_count: 128
    seed_family: model0818_observed_final_r128_b128_v2
    cache_namespace: R128_B128_final_v2
    probability_aggregation: mean_probability_then_metrics

baselines:
  - random_choice_probability_0p5
  - causal_running_choice_bias_beta_half_half

execution:
  search_parallel_budget_single_subject: 128
  final_rescore_n_jobs: 128
  numerical_library_threads_per_process: 1

# Use the repository's standard simulation -> run_model_evaluation contract.
# Four fresh PF repeats mirror the established 0813_pf evaluation workflow;
# they are diagnostic log-producing runs, not the 128-seed final fit score.
evaluation:
  reference_dir: results/model_dynamic_adaptive_control/0813_pf/model_evaluation
  simulation_dir: results/model_0818/cond1/exploratory_observed_fit_pre_recovery_v2/simulation
  output_dir: results/model_0818/cond1/exploratory_observed_fit_pre_recovery_v2/model_evaluation
  particle_count: 128
  filter_seed_count: 4
  hyper_base_seed: 20260823
  n_jobs_per_subject: 4
  keep_logs: true
  prediction_mode: prior_t
  oral_mode: center
