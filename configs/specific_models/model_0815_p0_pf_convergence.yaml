analysis_id: model_0815_p0_pf_convergence_v1
scope: p0_probability_and_latent_state_numerical_convergence

# Replace this with the frozen generated simulation config after beta
# recalibration. The current path permits a smoke test of the unfitted anchor.
base_simulation_config: configs/simulation_cfg/model0815_p0_cond1_beta_recalibration.yaml
output_dir: results/model_dynamic_adaptive_control/0815_p0/pf_convergence

calibration:
  subjects: [103, 120, 127]
  particle_counts: [64, 128, 256, 512]
  filter_seed_repeats: 8
  max_trials: null
  base_seed: 20260815
  n_jobs: 8

  # A count passes only if it agrees with the next larger count and its own
  # split-half seed ensembles. Thresholds are declared before full execution.
  stability_gates:
    maximum_successive_choice_nll_change: 0.002
    maximum_successive_choice_probability_rmse: 0.010
    maximum_successive_executed_posterior_js: 0.020
    maximum_split_half_choice_probability_rmse: 0.010
    minimum_median_post_choice_ess_fraction: 0.20
