# Two-layer hyper-optimization example (inner optimizer = grid)
inner_optimizer: grid
inner_base_config_path: ../grid_opt_cfg/pmh_cond1.yaml

# Optional; if omitted, will fallback to inner config subjects/subject_range
subjects: [101, 102]

output_dir: ../../results/state-based-hyper-opt/pmh/cond1_example
selection_metric: min_inner_mean_error
hyperparam_selection_mode: per_subject   # per_subject|group_mean
save_level: compact   # compact|full
random_seed: 42

# HYPERPARAMS TO BE OPTIMIZED
hyperparam_space:
  engine.modules.beta_mod.kwargs.beta_init:
    values: [1.0, 3.0]
  engine.modules.beta_mod.kwargs.decrease_rate:
    values: [0.1, 0.2, 0.3]
  engine.modules.beta_mod.kwargs.correct_additive:
    values: [0.5, 1, 2]
  inner.window_size:
    values: [32, 16, 8]
# 2-STAGE CONFIG
stages:
  coarse:
    inner_overrides:
      n_repeats: 4
      refit_repeats: 32
      keep_logs: false
      n_jobs: 8
      param_grid:
        gamma: [0.2, 0.6, 0.9]
        w0: [0.01, 0.05, 0.1, 0.2, 0.4]

  fine:
    inner_overrides:
      n_repeats: 16
      refit_repeats: 32
      keep_logs: false
      n_jobs: 8
      param_grid:
        gamma: [0.2, 0.4, 0.6, 0.8, 0.9, 0.95, 0.99]
        w0: [0.01, 0.02, 0.05, 0.1, 0.15, 0.2, 0.3, 0.5]

refine_policy:
  top_k: 4
