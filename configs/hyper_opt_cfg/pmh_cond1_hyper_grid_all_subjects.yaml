# Two-layer hyper-optimization for all cond1 subjects
# Outer optimizer: grid-first hyperparameter search
# Inner optimizer: existing grid optimizer over memory params (gamma/w0)
inner_optimizer: grid
inner_base_config_path: ../grid_opt_cfg/pmh_cond1.yaml

# cond1 subjects (same range used by current cond1 grid config)
subject_range: [101, 132]

output_dir: ../../results/state-based-hyper-opt/pmh/cond1
selection_metric: min_inner_mean_error
hyperparam_selection_mode: per_subject   # per_subject|group_mean
save_level: compact   # compact|full
random_seed: 42

# Hyperparameters to optimize (explicitly user-defined; no implicit defaults)
# Keep each dimension at 3~4 candidates, while limiting total dimensions.
hyperparam_space:
  # IMPORTANT: window size
  inner.window_size:
    values: [16, 8]

  # Hypothesis transition (cond1 baseline: original_strategies_a)
  # Include strategy templates as candidates (8 templates).
  # Cond1 hypo pool is small, so each template keeps active hypotheses conservative.
  engine.modules.hypo_transitions_mod.kwargs.strategies:
    values:
      # T1: cond1 baseline
      - [
          {amount: "random_4", method: "random_posterior"},
          {amount: "opp_random_4", method: "random"}
        ]
      # T2: slightly smaller exploration than baseline
      - [
          {amount: "random_4", method: "random_posterior"},
          {amount: "opp_random_2", method: "random"}
        ]
      # T3: balanced low-count random policy
      - [
          {amount: "random_3", method: "random_posterior"},
          {amount: "opp_random_4", method: "random"}
        ]
      # T4: conservative policy
      - [
          {amount: "random_2", method: "random_posterior"},
          {amount: "opp_random_2", method: "random"}
        ]
      # T5: confidence-driven retention + random exploration
      - [
          {amount: "max_4", method: "random_posterior"},
          {amount: "opp_random_2", method: "random"}
        ]
      # T6: confidence-driven retention + confidence-opposite exploration
      - [
          {amount: "entropy_4", method: "random_posterior"},
          {amount: "opp_entropy_4", method: "random"}
        ]
      # T7: entropy-like retention + conservative random exploration
      - [
          {amount: "entropy_4", method: "random_posterior"},
          {amount: "opp_random_2", method: "random"}
        ]
      # T8: top-p posterior retention + random exploration
      - [
          {amount: "fixed", method: "top_posterior", top_p: 0.70, value: 2},
          {amount: "fixed", method: "random", value: 1}
        ]
  engine.modules.hypo_transitions_mod.kwargs.max_active_hypotheses:
    values: [3, 4]
  engine.modules.hypo_transitions_mod.kwargs.init_num:
    values: [2, 3]

  # Beta module (choose a few impactful knobs)
  engine.modules.beta_mod.kwargs.beta_init:
    values: [0.8, 1.5, 3.0]
  engine.modules.beta_mod.kwargs.decrease_rate:
    values: [0.1, 0.2, 0.3]
  engine.modules.beta_mod.kwargs.prior_beta_scale:
    values: [5.0, 10.0, 15.0]

# Two-stage setup: coarse -> fine
stages:
  coarse:
    inner_overrides:
      n_repeats: 8
      refit_repeats: 32
      keep_logs: false
      n_jobs: 128
      param_grid:
        gamma: [0.2, 0.6, 0.9]
        w0: [0.02, 0.1, 0.3]

  fine:
    inner_overrides:
      n_repeats: 32
      refit_repeats: 1024
      keep_logs: false
      n_jobs: 128
      param_grid:
        gamma: [0.2, 0.4, 0.6, 0.8, 0.95]
        w0: [0.01, 0.03, 0.08, 0.15, 0.3]

refine_policy:
  top_k: 8
