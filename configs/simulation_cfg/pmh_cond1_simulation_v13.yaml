# Fixed-parameter simulation config for the Cond1 v13 controller on 19 geometric rules.
engine_config_path: ../model_struct/pmh_model_cond1_v13.yaml

subject_range: [101, 132]

hyper_base_seed: 42

dataset:
  processed_dir: ../../data/processed
  learning_data: Task2_processed.csv
  perception_summary: Task1b_errorsummary_24.csv
  perception_summary_72: Task1b_errorsummary_72.csv
  feature_order_data: Task2_processed.csv

output_dir: ../../results/state-based-simulation/pmh/cond1_v13
oral:
  mode: center

n_jobs: 64
simulation_repeats: 1024

window_size: 16
stop_at: 1.0
max_trials: null
keep_logs: true

prediction_mode: prior_t
selection_prediction_mode: prior_t

loss_metric: choice_brier
