# Small fixed-parameter simulation config for cond1 subjects 101-108.
# Intended for end-to-end hyper-then-simulation tests, not final analyses.
engine_config_path: ../model_struct/pmh_model_cond1.yaml

subject_range: [101, 108]

hyper_base_seed: 42

dataset:
  processed_dir: ../../data/processed
  learning_data: Task2_processed.csv
  perception_summary: Task1b_errorsummary_24.csv
  perception_summary_72: Task1b_errorsummary_72.csv
  feature_order_data: Task2_processed.csv

output_dir: ../../results/state-based-simulation/pmh/cond1_v10_test8
oral:
  mode: center

# Local test budget. Increase this on the server if desired.
n_jobs: 12
simulation_repeats: 256

window_size: 16
stop_at: 1.0
max_trials: null
keep_logs: false

prediction_mode: prior_t
selection_prediction_mode: prior_t

loss_metric: choice_brier
