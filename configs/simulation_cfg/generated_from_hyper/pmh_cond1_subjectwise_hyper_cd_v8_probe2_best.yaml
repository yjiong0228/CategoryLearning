          kwargs:
            init_num: 9
            max_active_hypotheses: 12
            strategies:
            - label: retain_core
              amount: fixed
              value: 1
              method: top_posterior
              pool: active
            - label: soft_retain
              amount: entropy_norm_5
              method: temperature_posterior
              pool: active
              min_count: 1
              temperature: 3.5
            - label: drop_refresh
              amount: opp_accuracy_delta_8
              method: random
              pool: inactive
              window: 5
              padding: chance
              feedback_mode: exact
              scale: 0.18
            - label: steady_explore
              amount: fixed
              value: 2
              method: random
              pool: inactive
        beta_mod:
          kwargs:
            beta_update_mode: probabilistic_feedback
