hyper_base_seed: 20260809
dataset:
  processed_dir: ../../../data/processed
  learning_data: Task2_processed.csv
  perception_summary: Task1b_errorsummary_24.csv
  perception_summary_72: Task1b_errorsummary_72.csv
  feature_order_data: Task2_processed.csv
output_dir: ../../../results/model_dynamic_continuous/0809_v1/simulation
oral:
  mode: center
n_jobs: 4
simulation_repeats: 4
window_size: 16
stop_at: 1.0
max_trials: null
keep_logs: true
prediction_mode: prior_t
selection_prediction_mode: prior_t
loss_metric: choice_nll
evaluation_protocol:
  mode: all
statistics_config:
  enabled: true
  mode: accuracy_shape
  primary_tolerance_abs: 0.01
  primary_tolerance_rel: 0.03
  run_choice_fraction: 0.1
engine_config:
  partition:
    class: src.Bayesian_state.hypothesis_space.observation_model.continuous_partition.ContinuousPartition
    kwargs:
      n_dims: 4
      n_cats: 2
  inference:
    backend: particle_filter
    particle_count: 512
    resample_threshold_fraction: 0.5
  likelihood:
    distance_mode: prototype

  modules:
    perception_mod:
      class: src.Bayesian_state.model.modules.perception.PerceptionModule
    beta_mod:
      class: src.Bayesian_state.model.modules.beta.BetaModule
      kwargs:
        beta_init: 5.0
        beta_min: 0.1
        beta_max: 25.0
        decrease_rate: 0.0
        correct_additive: 0.0
        beta_update_mode: probabilistic_feedback
        probabilistic_feedback_lapse: 0.0
        use_prior_scaling: false
        prior_beta_scale: 0.0
    hypo_transitions_mod:
      class: src.Bayesian_state.model.modules.hypothesis_transition.dynamic_adaptive_control.DynamicAdaptiveControlHypothesisTransitionModule
      kwargs:
        capacity: 3
        m: 0.15
        m_phi: 0.5
        m_beta_surprise: 0.8
        surprise_center: 2.56
        surprise_scale: 4.58
        m_beta_uncertainty: 0.0
        uncertainty_center: 0.1332542767
        uncertainty_scale: 0.0643078377
        g: 0.35
        range_controller:
          g_phi: 0.0
          g_beta_surprise: 0.0
          g_beta_uncertainty: 0.0
        epsilon: 1.0e-12
        rate_controller: {}
    memory_mod:
      class: src.Bayesian_state.model.modules.memory.DualMemoryModule
      kwargs: {}
  choice_readout:
    kwargs: {}
  output_noise:
    kwargs:
      enabled: true
      base_lapse: 0.05
      post_error_lapse: 0.0
      low_accuracy_lapse: 0.0
      low_accuracy_threshold: 0.7
      recent_accuracy_window: 8
      lapse_decay: 0.0
      max_lapse: 1.0
      lapse_target: uniform
      latent_volatility_lapse: 0.0
      latent_volatility_power: 1.0
  agenda:
  - perception_mod
  - hypo_transitions_mod
  - memory_mod
  - beta_mod
