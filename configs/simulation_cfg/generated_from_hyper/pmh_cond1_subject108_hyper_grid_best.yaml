hyper_base_seed: 42
dataset:
  processed_dir: ../../../data/processed
  learning_data: Task2_processed.csv
  perception_summary: Task1b_errorsummary_24.csv
  perception_summary_72: Task1b_errorsummary_72.csv
  feature_order_data: Task2_processed.csv
output_dir: ../../../results/state-based-simulation/pmh/cond1_subject108_hyper_grid_best
oral:
  mode: center
n_jobs: 128
simulation_repeats: 1024
window_size: 16
stop_at: 1.0
max_trials: null
keep_logs: true
prediction_mode: prior_t
selection_prediction_mode: prior_t
loss_metric: choice_brier
engine_config:
  modules:
    perception_mod:
      class: src.Bayesian_state.problems.modules.perception.PerceptionModule
    beta_mod:
      class: src.Bayesian_state.problems.modules.beta.BetaModule
      kwargs:
        beta_init: 1.0
        beta_min: 0.1
        beta_max: 50.0
        decrease_rate: 0.2
        correct_additive: 1
        use_prior_scaling: true
        prior_beta_scale: 10.0
    hypo_transitions_mod:
      class: src.Bayesian_state.problems.modules.hypo_transitions.DynamicHypothesisModule
      kwargs:
        strategies:
        - label: retain_random
          amount: random_4
          method: random_posterior
          pool: active
        - label: explore_random
          amount: opp_random_4
          method: random
          pool: inactive
        init_num: 2
        max_active_hypotheses: 3
    likelihood_mod:
      class: src.Bayesian_state.problems.modules.likelihood.LikelihoodModule
      kwargs:
        distance_mode: prototype
    memory_mod:
      class: src.Bayesian_state.problems.modules.memory.DualMemoryModule
      kwargs:
        w0: 0.02
        gamma: 0.2
  agenda:
  - perception_mod
  - hypo_transitions_mod
  - likelihood_mod
  - memory_mod
  - beta_mod
subjects:
- 108
subject_overrides:
  '108':
    engine_config:
      modules:
        memory_mod:
          kwargs:
            gamma: 0.6
            w0: 0.5
        hypo_transitions_mod:
          kwargs:
            strategies:
            - label: retain_entropy
              amount: entropy_norm_3
              method: epsilon_posterior
              pool: active
              min_count: 1
              epsilon: 0.35
            - label: explore_entropy
              amount: opp_entropy_norm_3
              method: random
              pool: inactive
            max_active_hypotheses: 3
            init_num: 3
        beta_mod:
          kwargs:
            beta_init: 0.8
            decrease_rate: 0.3
            prior_beta_scale: 15.0
    fixed_hyperparams:
      engine.modules.memory_mod.kwargs.gamma: 0.6
      engine.modules.memory_mod.kwargs.w0: 0.5
      engine.modules.hypo_transitions_mod.kwargs.strategies:
      - label: retain_entropy
        amount: entropy_norm_3
        method: epsilon_posterior
        pool: active
        min_count: 1
        epsilon: 0.35
      - label: explore_entropy
        amount: opp_entropy_norm_3
        method: random
        pool: inactive
      engine.modules.hypo_transitions_mod.kwargs.max_active_hypotheses: 3
      engine.modules.hypo_transitions_mod.kwargs.init_num: 3
      engine.modules.beta_mod.kwargs.beta_init: 0.8
      engine.modules.beta_mod.kwargs.decrease_rate: 0.3
      engine.modules.beta_mod.kwargs.prior_beta_scale: 15.0
    hyper_candidate_seed: 2313375588
