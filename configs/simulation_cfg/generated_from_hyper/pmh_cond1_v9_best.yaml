          epsilon: 0.5
        - label: explore_uncertain
          amount: opp_confidence_3
          method: random
          pool: inactive
      engine.modules.beta_mod.kwargs.beta_init: 3.0
      engine.modules.beta_mod.kwargs.decrease_rate: 0.05
      engine.modules.beta_mod.kwargs.prior_beta_scale: 10.0
      engine.modules.beta_mod.kwargs.correct_additive: 2.0
      engine.output_noise.kwargs.base_lapse: 0.05
      engine.output_noise.kwargs.max_lapse: 0.05
