hyper_base_seed: 42
dataset:
  processed_dir: ../../../data/processed
  learning_data: Task2_processed.csv
  perception_summary: Task1b_errorsummary_24.csv
  perception_summary_72: Task1b_errorsummary_72.csv
  feature_order_data: Task2_processed.csv
output_dir: ../../../results/state-based-simulation/pmh/cond1_v9
oral:
  mode: center
n_jobs: 128
simulation_repeats: 2048
window_size: 16
stop_at: 1.0
max_trials: null
keep_logs: true
prediction_mode: prior_t
selection_prediction_mode: prior_t
loss_metric: choice_brier
engine_config:
  likelihood:
    distance_mode: prototype

  modules:
    perception_mod:
      class: src.Bayesian_state.model.modules.perception.PerceptionModule
    beta_mod:
      class: src.Bayesian_state.model.modules.beta.BetaModule
      kwargs:
        beta_init: 1.0
        beta_min: 0.1
        beta_max: 50.0
        decrease_rate: 0.2
        correct_additive: 1
        use_prior_scaling: true
        prior_beta_scale: 10.0
    hypo_transitions_mod:
      class: src.Bayesian_state.model.modules.hypothesis_transition.fixed_strategy.FixedStrategyHypothesisTransitionModule
      kwargs:
        strategies:
        - label: retain_random
          amount: random_4
          method: random_posterior
          pool: active
        - label: explore_random
          amount: opp_random_4
          method: random
          pool: inactive
        init_num: 2
        max_active_hypotheses: 3
    memory_mod:
      class: src.Bayesian_state.model.modules.memory.DualMemoryModule
      kwargs:
        w0: 0.02
        gamma: 0.2
  agenda:
  - perception_mod
  - hypo_transitions_mod
  - memory_mod
  - beta_mod
subjects:
- 127
- 128
- 129
- 130
- 131
- 132
subject_overrides:
  '127':
    engine_config:
      modules:
        memory_mod:
          kwargs:
            gamma: 0.8
            w0: 0.03
        hypo_transitions_mod:
          kwargs:
            init_num: 4
            max_active_hypotheses: 9
            strategies:
            - label: core_retain
              amount: fixed
              value: 1
              method: top_posterior
              pool: active
            - label: soft_retain
              amount: confidence_3
              method: epsilon_posterior
              pool: active
              min_count: 1
              epsilon: 0.5
            - label: explore_uncertain
              amount: opp_confidence_3
              method: random
              pool: inactive
        beta_mod:
          kwargs:
            beta_init: 3.0
            decrease_rate: 0.05
            prior_beta_scale: 10.0
            correct_additive: 2.0
      output_noise:
        kwargs:
          base_lapse: 0.05
          max_lapse: 0.05
          lapse_target: uniform
    fixed_hyperparams:
      engine.modules.memory_mod.kwargs:
        gamma: 0.8
        w0: 0.03
      engine.modules.hypo_transitions_mod.kwargs:
        init_num: 4
        max_active_hypotheses: 9
