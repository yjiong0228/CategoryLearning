dataset:
  processed_dir: ../../../data/processed
  learning_data: Task2_processed.csv
  perception_summary: Task1b_errorsummary_24.csv
  perception_summary_72: Task1b_errorsummary_72.csv
  feature_order_data: Task2_processed.csv
output_dir: ../../../results/state-based-simulation/pmh/cond1_subjectwise_hyper_cd_best
oral:
  mode: center
n_jobs: 64
simulation_repeats: 1024
window_size: 16
stop_at: 1.0
max_trials: null
keep_logs: false
prediction_mode: prior_t
selection_prediction_mode: prior_t
loss_metric: choice_brier
statistics_config:
  enabled: true
  mode: distribution_ppc_interval
  primary_tolerance_abs: 0.01
  primary_tolerance_rel: 0.03
  run_choice_fraction: 0.1
  distribution_min_run_count: 64
  distribution_interval_alpha: 0.1
engine_config:
  partition:
    class: src.Bayesian_state.hypothesis_space.observation_model.continuous_partition.ContinuousPartition
    kwargs:
      n_dims: 4
      n_cats: 2
  likelihood:
    distance_mode: prototype

  modules:
    perception_mod:
      class: src.Bayesian_state.model.modules.perception.PerceptionModule
    beta_mod:
      class: src.Bayesian_state.model.modules.beta.BetaModule
      kwargs:
        beta_init: 5.0
        beta_min: 0.1
        beta_max: 25.0
        decrease_rate: 0.15
        correct_additive: 0.5
        use_prior_scaling: true
        prior_beta_scale: 3.0
        beta_update_mode: inferred_correct_category
    hypo_transitions_mod:
      class: src.Bayesian_state.model.modules.hypothesis_transition.dynamic_discrete_strategy.DynamicDiscreteStrategyHypothesisTransitionModule
      kwargs: {}
    memory_mod:
      class: src.Bayesian_state.model.modules.memory.DualMemoryModule
      kwargs: {}
  choice_readout:
    kwargs: {}
  agenda:
  - perception_mod
  - hypo_transitions_mod
  - memory_mod
  - beta_mod
subjects:
- 103
- 105
- 111
- 112
- 117
- 118
- 127
- 131
