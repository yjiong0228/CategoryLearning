                  trial_progress: 0.8
                  posterior_entropy: 0.5
                active_limit: 5
                explore_count: 1
                retain_temperature: 0.9
                post_to_prior:
                  method: similarity_novelty
                  min_newcomer_scale: 0.04
              - id: aggressive
                policy_method: aggressive
                activation:
                  bias: 0.5
                  posterior_entropy: 1.0
                  trial_progress: -1.2
                  latent_volatility_pressure: 1.5
                active_limit: 5
                max_newcomers: 4
                min_newcomers: 1
              - id: stubborn
