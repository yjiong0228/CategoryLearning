engine_config_path: ../model_struct/pmh_model_cond1_v14.yaml
subject_range: [101, 132]
hyper_base_seed: 140014

dataset:
  processed_dir: ../../data/processed
  learning_data: Task2_processed.csv
  perception_summary: Task1b_errorsummary_24.csv
  perception_summary_72: Task1b_errorsummary_72.csv
  feature_order_data: Task2_processed.csv

output_dir: ../../results/state-based-simulation/pmh/cond1_v14
oral:
  mode: center

n_jobs: 64
simulation_repeats: 1024
window_size: 16
stop_at: 1.0
max_trials: null
keep_logs: false
prediction_mode: prior_t
selection_prediction_mode: prior_t
loss_metric: choice_brier

statistics_config:
  enabled: true
  mode: distribution_ppc_interval
  primary_tolerance_abs: 0.010
  primary_tolerance_rel: 0.03
  run_choice_fraction: 0.10
  distribution_min_run_count: 64
  distribution_interval_alpha: 0.10
